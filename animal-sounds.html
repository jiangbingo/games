<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#2a9d8f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="动物叫声">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title>动物叫声 - 儿童逻辑思维游戏</title>
    <link rel="stylesheet" href="/css/kids.css">
    <style>
        :root {
            --game-accent: #2a9d8f;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--kui-paper);
            background-image: radial-gradient(rgba(47, 42, 37, 0.03) 1px, transparent 1.4px);
            background-size: 26px 26px;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--kui-ink);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        #app {
            max-width: 640px;
            margin: 0 auto;
            padding: 14px 14px 30px;
        }

        .game-container {
            background: var(--kui-card);
            border: 2px solid var(--kui-line);
            border-radius: var(--kui-radius-lg);
            box-shadow: var(--kui-shadow);
            padding: 18px;
        }

        .mode-toggle {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .mode-btn {
            padding: 12px 26px;
            font-size: 1rem;
            font-weight: 800;
            color: var(--kui-ink);
            background: var(--kui-paper);
            border: 3px solid var(--kui-line);
            border-radius: 999px;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.12s var(--kui-bounce);
        }

        .mode-btn:active {
            transform: scale(0.95);
        }

        .mode-btn.active {
            background: var(--game-accent);
            border-color: var(--game-accent);
            color: #fff;
            box-shadow: var(--kui-shadow);
        }

        .animals-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        .animal-btn {
            background: var(--kui-paper);
            border: 3px solid var(--kui-line);
            border-radius: var(--kui-radius-md);
            box-shadow: var(--kui-shadow);
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.12s var(--kui-bounce);
        }

        .animal-btn .emoji {
            font-size: clamp(38px, 11vw, 54px);
        }

        .animal-btn .name {
            font-size: 0.95rem;
            font-weight: 800;
        }

        .animal-btn:active {
            transform: scale(0.93);
        }

        .guess-section {
            text-align: center;
        }

        .guess-title {
            font-size: 1.15rem;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .play-sound-btn {
            padding: 14px 34px;
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            background: var(--game-accent);
            border: none;
            border-radius: 999px;
            box-shadow: var(--kui-shadow);
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.12s var(--kui-bounce);
        }

        .play-sound-btn:active {
            transform: scale(0.95);
        }

        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            max-width: 420px;
            margin: 18px auto 0;
        }

        .option-btn {
            font-size: clamp(38px, 11vw, 52px);
            padding: 16px 0;
            background: var(--kui-card);
            border: 3px solid var(--kui-line);
            border-radius: var(--kui-radius-md);
            box-shadow: var(--kui-shadow);
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.12s var(--kui-bounce);
        }

        .option-btn:active {
            transform: scale(0.95);
        }

        .option-btn.correct {
            background: #e8f5ee;
            border-color: var(--kui-good);
            animation: pop 0.5s ease;
        }

        @keyframes pop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        .option-btn.wrong {
            animation: shake 0.4s ease;
            border-color: var(--kui-bad);
            background: #fdeae7;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .stats-area {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        @media (max-width: 480px) {
            .animals-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .mode-btn, .animal-btn, .option-btn, .play-sound-btn { transition: none; }
            .option-btn.correct, .option-btn.wrong { animation-duration: 0.01s; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="game-container">
            <div class="mode-toggle">
                <button type="button" class="mode-btn active" id="freeBtn">🎵 自由听</button>
                <button type="button" class="mode-btn" id="guessBtn">🎯 猜一猜</button>
            </div>

            <div id="freePlayMode" class="animals-grid" aria-label="自由听动物叫声"></div>

            <div id="guessMode" class="guess-section" hidden>
                <p class="guess-title">👂 猜猜是谁在叫？</p>
                <button type="button" class="play-sound-btn" id="playSoundBtn">🔊 再听一次</button>
                <div class="options" id="guessOptions" aria-label="动物选项"></div>
            </div>

            <div class="stats-area">
                <span class="kui-chip">⭐ 猜对 <b id="score">0</b> 次</span>
            </div>
        </div>
    </div>

    <script src="/js/kids-ui.js"></script>
    <script src="/pwa.js" defer></script>
    <script>
        const ANIMALS = {
            '🐶': { name: '小狗', freq: 400, duration: 0.3, pattern: 'bark' },
            '🐱': { name: '小猫', freq: 600, duration: 0.4, pattern: 'meow' },
            '🐮': { name: '奶牛', freq: 150, duration: 0.8, pattern: 'moo' },
            '🐷': { name: '小猪', freq: 300, duration: 0.5, pattern: 'oink' },
            '🐸': { name: '青蛙', freq: 200, duration: 0.2, pattern: 'croak' },
            '🦁': { name: '狮子', freq: 120, duration: 1.0, pattern: 'roar' },
            '🐔': { name: '公鸡', freq: 500, duration: 0.6, pattern: 'crow' },
            '🦆': { name: '鸭子', freq: 350, duration: 0.35, pattern: 'quack' }
        };

        let audioContext = null;

        function getAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioContext;
        }

        function playBark(audio, osc, gain, animal) {
            osc.type = 'square';
            gain.gain.setValueAtTime(0.3, audio.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + animal.duration);
            osc.frequency.setValueAtTime(animal.freq, audio.currentTime);
            osc.frequency.setValueAtTime(animal.freq * 0.8, audio.currentTime + 0.1);
            osc.start(audio.currentTime);
            osc.stop(audio.currentTime + animal.duration);
        }

        function playMeow(audio, osc, gain, animal) {
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.3, audio.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + animal.duration);
            osc.frequency.setValueAtTime(animal.freq * 0.7, audio.currentTime);
            osc.frequency.linearRampToValueAtTime(animal.freq * 1.2, audio.currentTime + animal.duration * 0.5);
            osc.frequency.linearRampToValueAtTime(animal.freq * 0.8, audio.currentTime + animal.duration);
            osc.start(audio.currentTime);
            osc.stop(audio.currentTime + animal.duration);
        }

        function playMoo(audio, osc, gain, animal) {
            osc.type = 'sawtooth';
            gain.gain.setValueAtTime(0.2, audio.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + animal.duration);
            osc.frequency.setValueAtTime(animal.freq, audio.currentTime);
            osc.start(audio.currentTime);
            osc.stop(audio.currentTime + animal.duration);
        }

        function playOink(audio, osc, gain, animal) {
            osc.type = 'square';
            for (let i = 0; i < 2; i++) {
                gain.gain.setValueAtTime(0.3, audio.currentTime + i * 0.25);
                gain.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + i * 0.25 + 0.2);
                osc.frequency.setValueAtTime(animal.freq, audio.currentTime + i * 0.25);
                osc.frequency.setValueAtTime(animal.freq * 1.2, audio.currentTime + i * 0.25 + 0.1);
            }
            osc.start(audio.currentTime);
            osc.stop(audio.currentTime + 0.5);
        }

        function playCroak(audio, osc, gain, animal) {
            osc.type = 'sine';
            for (let i = 0; i < 3; i++) {
                gain.gain.setValueAtTime(0.3, audio.currentTime + i * 0.15);
                gain.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + i * 0.15 + 0.1);
            }
            osc.frequency.setValueAtTime(animal.freq, audio.currentTime);
            osc.frequency.setValueAtTime(animal.freq * 1.5, audio.currentTime + 0.15);
            osc.frequency.setValueAtTime(animal.freq * 2, audio.currentTime + 0.3);
            osc.start(audio.currentTime);
            osc.stop(audio.currentTime + 0.45);
        }

        function playRoar(audio, osc, gain, animal) {
            osc.type = 'sawtooth';
            gain.gain.setValueAtTime(0, audio.currentTime);
            gain.gain.linearRampToValueAtTime(0.4, audio.currentTime + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + animal.duration);
            osc.frequency.setValueAtTime(animal.freq * 0.5, audio.currentTime);
            osc.frequency.linearRampToValueAtTime(animal.freq, audio.currentTime + animal.duration);
            osc.start(audio.currentTime);
            osc.stop(audio.currentTime + animal.duration);
        }

        function playCrow(audio, osc, gain, animal) {
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.3, audio.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + animal.duration);
            osc.frequency.setValueAtTime(animal.freq * 0.5, audio.currentTime);
            osc.frequency.linearRampToValueAtTime(animal.freq * 1.5, audio.currentTime + animal.duration * 0.3);
            osc.frequency.setValueAtTime(animal.freq * 1.2, audio.currentTime + animal.duration * 0.5);
            osc.start(audio.currentTime);
            osc.stop(audio.currentTime + animal.duration);
        }

        function playQuack(audio, osc, gain, animal) {
            osc.type = 'square';
            for (let i = 0; i < 2; i++) {
                gain.gain.setValueAtTime(0.3, audio.currentTime + i * 0.2);
                gain.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + i * 0.2 + 0.15);
            }
            osc.frequency.setValueAtTime(animal.freq, audio.currentTime);
            osc.frequency.setValueAtTime(animal.freq * 0.9, audio.currentTime + 0.2);
            osc.start(audio.currentTime);
            osc.stop(audio.currentTime + 0.35);
        }

        const PLAYERS = {
            bark: playBark,
            meow: playMeow,
            moo: playMoo,
            oink: playOink,
            croak: playCroak,
            roar: playRoar,
            crow: playCrow,
            quack: playQuack
        };

        function playAnimalSound(emoji) {
            const animal = ANIMALS[emoji];
            if (!animal) return;
            const audio = getAudioContext();
            if (audio.state === 'suspended') audio.resume();
            const osc = audio.createOscillator();
            const gain = audio.createGain();
            osc.connect(gain);
            gain.connect(audio.destination);
            PLAYERS[animal.pattern](audio, osc, gain, animal);
        }

        /**
         * 动物叫声：自由听 + 听音猜动物。答对会读出动物名字。
         */
        class AnimalSoundsGame {
            constructor() {
                this.gameId = 'animal-sounds';
                this.CELEBRATE_EVERY = 5;
                this.score = 0;
                this.misses = 0;
                this.currentGuess = null;
                this.isBusy = false;
                this.init();
            }

            init() {
                KidsUI.Touch.guard();
                KidsUI.Header.render({
                    title: '动物叫声',
                    accent: '#2a9d8f',
                    showReplay: false
                });
                this.renderFreeMode();
                this.bindEvents();
            }

            bindEvents() {
                document.getElementById('freeBtn').addEventListener('click', () => this.setMode('free'));
                document.getElementById('guessBtn').addEventListener('click', () => this.setMode('guess'));
                document.getElementById('playSoundBtn').addEventListener('click', () => {
                    if (this.currentGuess) playAnimalSound(this.currentGuess);
                });
            }

            setMode(mode) {
                if (this.roundTimer) {
                    clearTimeout(this.roundTimer);
                    this.roundTimer = null;
                }
                KidsUI.SFX.tap();
                document.getElementById('freeBtn').classList.toggle('active', mode === 'free');
                document.getElementById('guessBtn').classList.toggle('active', mode === 'guess');
                document.getElementById('freePlayMode').hidden = mode !== 'free';
                document.getElementById('guessMode').hidden = mode !== 'guess';
                if (mode === 'guess') this.startNewGuess();
            }

            renderFreeMode() {
                const grid = document.getElementById('freePlayMode');
                Object.entries(ANIMALS).forEach(([emoji, animal]) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'animal-btn';
                    btn.innerHTML = `<span class="emoji">${emoji}</span><span class="name">${animal.name}</span>`;
                    btn.addEventListener('click', () => {
                        playAnimalSound(emoji);
                        KidsUI.TTS.speak(animal.name);
                    });
                    grid.appendChild(btn);
                });
            }

            startNewGuess() {
                this.isBusy = false;
                const keys = Object.keys(ANIMALS);
                this.currentGuess = keys[Math.floor(Math.random() * keys.length)];

                const options = [this.currentGuess];
                while (options.length < 4) {
                    const key = keys[Math.floor(Math.random() * keys.length)];
                    if (!options.includes(key)) options.push(key);
                }
                options.sort(() => Math.random() - 0.5);

                const area = document.getElementById('guessOptions');
                area.innerHTML = '';
                options.forEach((emoji) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'option-btn';
                    btn.textContent = emoji;
                    btn.addEventListener('click', () => this.checkGuess(emoji, btn));
                    area.appendChild(btn);
                });

                playAnimalSound(this.currentGuess);
                KidsUI.TTS.speak('猜猜是哪个动物');
            }

            checkGuess(emoji, btn) {
                if (this.isBusy) return;
                const animal = ANIMALS[this.currentGuess];

                if (emoji === this.currentGuess) {
                    this.isBusy = true;
                    this.score += 1;
                    document.getElementById('score').textContent = this.score;
                    KidsUI.SFX.correct();
                    KidsUI.haptic('good');
                    KidsUI.TTS.speak(animal.name);
                    btn.classList.add('correct');

                    if (this.score % this.CELEBRATE_EVERY === 0) {
                        const stars = KidsUI.Progress.starsFor(this.score / (this.score + this.misses));
                        KidsUI.Progress.record(this.gameId, { best: this.score, stars });
                        setTimeout(() => {
                            KidsUI.Celebrate.show({
                                title: '小耳朵真灵！',
                                sub: `已经猜对 ${this.score} 次`,
                                stars,
                                primaryLabel: '继续猜',
                                onPrimary: () => this.startNewGuess(),
                                announce: '太厉害了！'
                            });
                        }, 900);
                    } else {
                        this.roundTimer = setTimeout(() => {
                            this.roundTimer = null;
                            this.startNewGuess();
                        }, 1500);
                    }
                } else {
                    this.misses += 1;
                    KidsUI.SFX.wrong();
                    KidsUI.haptic('bad');
                    btn.classList.add('wrong');
                    setTimeout(() => btn.classList.remove('wrong'), 500);
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new AnimalSoundsGame();
        });
    </script>
</body>
</html>
