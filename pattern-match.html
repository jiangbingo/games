<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#ff9f1c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="模式连连看">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title>模式连连看 - 儿童逻辑思维游戏</title>
    <link rel="stylesheet" href="/css/kids.css">
    <style>
        :root {
            --game-accent: #ff9f1c;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--kui-paper);
            background-image: radial-gradient(rgba(47, 42, 37, 0.03) 1px, transparent 1.4px);
            background-size: 26px 26px;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--kui-ink);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        #app {
            max-width: 800px;
            margin: 0 auto;
            padding: 14px 14px 30px;
        }

        .game-container {
            background: var(--kui-card);
            border: 2px solid var(--kui-line);
            border-radius: var(--kui-radius-lg);
            box-shadow: var(--kui-shadow);
            padding: 18px;
        }

        .level-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            gap: 10px;
        }
        .theme-name {
            font-size: 1rem;
            font-weight: 800;
            color: var(--kui-ink-soft);
        }
        .level-badge {
            background: var(--game-accent);
            color: #fff;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 0.95rem;
            font-weight: 800;
            box-shadow: var(--kui-shadow);
        }

        .instruction {
            text-align: center;
            font-size: clamp(18px, 4.5vw, 22px);
            font-weight: 800;
            margin-bottom: 18px;
        }

        .pattern-sequence {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 26px;
        }

        .pattern-item {
            width: clamp(56px, 15vw, 80px);
            height: clamp(56px, 15vw, 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(30px, 8vw, 50px);
            background: var(--kui-paper);
            border: 2px solid var(--kui-line);
            border-radius: var(--kui-radius-md);
        }

        .pattern-item.blank {
            background: #fff6e6;
            border: 3px dashed var(--game-accent);
            color: var(--game-accent);
        }

        .pattern-item.filled {
            border-color: var(--kui-good);
            animation: popIn 0.3s var(--kui-bounce);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); opacity: 1; }
        }

        .options-title {
            text-align: center;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--kui-ink-soft);
            margin-bottom: 14px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
            gap: 14px;
            max-width: 560px;
            margin: 0 auto 22px;
        }

        .option-btn {
            aspect-ratio: 1;
            font-size: clamp(34px, 9vw, 54px);
            background: var(--kui-card);
            border: 3px solid var(--kui-line);
            border-radius: var(--kui-radius-md);
            box-shadow: var(--kui-shadow);
            cursor: pointer;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.12s var(--kui-bounce), box-shadow 0.12s, border-color 0.12s;
        }

        .option-btn:hover {
            transform: translateY(-3px);
            border-color: var(--game-accent);
        }

        .option-btn:active {
            transform: scale(0.95);
            box-shadow: none;
        }

        .option-btn.used {
            opacity: 0.35;
            transform: scale(0.88);
            pointer-events: none;
            box-shadow: none;
        }

        .option-btn.wrong {
            animation: shake 0.4s ease;
            border-color: var(--kui-bad);
            background: #fdeae7;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .stats-area {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        @media (prefers-reduced-motion: reduce) {
            .option-btn, .pattern-item { transition: none; }
            .pattern-item.filled { animation-duration: 0.01s; }
            .option-btn.wrong { animation-duration: 0.01s; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="game-container">
            <div class="level-row">
                <span class="theme-name" id="theme-name">🔗 找规律</span>
                <div class="level-badge" id="level-badge">第 1/10 关</div>
            </div>

            <p class="instruction">🔍 看看规律，点一下把 ❓ 补上！</p>

            <div class="pattern-sequence" id="pattern-sequence" aria-label="图案序列"></div>

            <div class="options-area">
                <div class="options-title">点一点，选出正确答案</div>
                <div class="options-grid" id="options-grid"></div>
            </div>

            <div class="stats-area">
                <span class="kui-chip">✅ 补上 <b id="correct-count">0/1</b></span>
                <span class="kui-chip">🏆 得分 <b id="score">0</b></span>
            </div>
        </div>
    </div>

    <script src="/js/kids-ui.js"></script>
    <script src="/pwa.js" defer></script>
    <script>
        /**
         * 模式连连看：看规律补 ❓。每个选项按「它该填哪个空位」校验，
         * 可乱序作答；选错不锁定，可立即重试。
         */
        class PatternMatchGame {
            constructor() {
                this.gameId = 'pattern-match';
                this.currentLevel = 1;
                this.maxLevels = 10;
                this.score = 0;
                this.misses = 0;
                this.sequence = [];
                this.blanks = [];
                this.filled = new Set();
                this.options = [];
                this.themeName = '';
                this.canClick = true;

                this.themes = {
                    colors: { name: '🎨 颜色', pool: ['🔴', '🔵', '🟢', '🟡', '🟣', '🟠'] },
                    fruits: { name: '🍎 水果', pool: ['🍎', '🍊', '🍋', '🍇', '🍓', '🍌'] },
                    animals: { name: '🐶 动物', pool: ['🐶', '🐱', '🐰', '🦊', '🐻', '🐼'] },
                    vehicles: { name: '🚗 车车', pool: ['🚗', '🚌', '🚓', '🚑', '🚒', '🚕'] }
                };

                this.levelConfig = [
                    // L1-3: ABAB 两元素循环
                    { level: 1, pattern: 'ABAB', length: 4, blanks: 1, options: 2 },
                    { level: 2, pattern: 'ABAB', length: 5, blanks: 1, options: 2 },
                    { level: 3, pattern: 'ABAB', length: 6, blanks: 2, options: 3 },
                    // L4-7: ABCABC 三元素循环
                    { level: 4, pattern: 'ABCABC', length: 6, blanks: 2, options: 3 },
                    { level: 5, pattern: 'ABCABC', length: 7, blanks: 2, options: 3 },
                    { level: 6, pattern: 'ABCABC', length: 8, blanks: 3, options: 4 },
                    { level: 7, pattern: 'ABCABC', length: 9, blanks: 3, options: 4 },
                    // L8-10: 不规则模式
                    { level: 8, pattern: 'AAB', length: 6, blanks: 2, options: 4 },
                    { level: 9, pattern: 'ABBA', length: 8, blanks: 3, options: 4 },
                    { level: 10, pattern: 'ABCBA', length: 9, blanks: 3, options: 4 }
                ];

                this.init();
            }

            init() {
                KidsUI.Touch.guard();
                KidsUI.Header.render({
                    title: '模式连连看',
                    accent: '#ff9f1c',
                    onReplay: () => this.startLevel(1)
                });
                this.startLevel(1);
            }

            startLevel(level) {
                this.currentLevel = level;
                this.misses = 0;
                this.filled = new Set();
                this.canClick = true;

                document.getElementById('level-badge').textContent = `第 ${level}/${this.maxLevels} 关`;

                this.generateLevel(level);
                document.getElementById('theme-name').textContent = this.themeName;
                this.renderSequence();
                this.renderOptions();
                this.updateStats();
                KidsUI.Progress.record(this.gameId, { best: level - 1 });
            }

            generateLevel(level) {
                const config = this.levelConfig[level - 1];
                const themeKeys = Object.keys(this.themes);
                const theme = this.themes[themeKeys[Math.floor(Math.random() * themeKeys.length)]];
                this.themeName = theme.name;

                // 模式串重复截取到目标长度，再映射为主题元素
                const repeated = config.pattern
                    .repeat(Math.ceil(config.length / config.pattern.length))
                    .slice(0, config.length);
                const uniqueChars = [...new Set(repeated.split(''))];
                const shuffledPool = [...theme.pool].sort(() => Math.random() - 0.5);
                const elementMap = {};
                uniqueChars.forEach((ch, i) => {
                    elementMap[ch] = shuffledPool[i];
                });
                this.sequence = repeated.split('').map((ch) => elementMap[ch]);

                const positions = this.sequence.map((_, i) => i);
                this.blanks = [];
                for (let i = 0; i < config.blanks; i++) {
                    this.blanks.push(positions.splice(Math.floor(Math.random() * positions.length), 1)[0]);
                }
                this.blanks.sort((a, b) => a - b);

                const blankElements = this.blanks.map((pos) => this.sequence[pos]);
                const distractors = theme.pool
                    .filter((el) => !blankElements.includes(el))
                    .sort(() => Math.random() - 0.5)
                    .slice(0, config.options - blankElements.length);
                this.options = [...blankElements, ...distractors].sort(() => Math.random() - 0.5);
            }

            renderSequence() {
                const container = document.getElementById('pattern-sequence');
                container.innerHTML = '';
                this.sequence.forEach((element, index) => {
                    const item = document.createElement('div');
                    item.className = 'pattern-item';
                    if (this.blanks.includes(index)) {
                        item.classList.add('blank');
                        item.textContent = '❓';
                        item.dataset.pos = index;
                    } else {
                        item.textContent = element;
                    }
                    container.appendChild(item);
                });
            }

            renderOptions() {
                const container = document.getElementById('options-grid');
                container.innerHTML = '';
                this.options.forEach((element) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'option-btn';
                    btn.textContent = element;
                    btn.addEventListener('click', () => this.pickOption(element, btn));
                    container.appendChild(btn);
                });
            }

            pickOption(element, btn) {
                if (!this.canClick) return;

                // 找到第一个「还没填、且需要这个元素」的空位
                const position = this.blanks.find(
                    (pos) => !this.filled.has(pos) && this.sequence[pos] === element
                );

                if (position === undefined) {
                    this.misses += 1;
                    KidsUI.SFX.wrong();
                    KidsUI.haptic('bad');
                    btn.classList.add('wrong');
                    setTimeout(() => btn.classList.remove('wrong'), 450);
                    return;
                }

                this.filled.add(position);
                KidsUI.SFX.correct();
                KidsUI.haptic('good');
                btn.classList.add('used');
                this.paintBlank(position, element);
                this.updateStats();

                if (this.filled.size === this.blanks.length) {
                    this.canClick = false;
                    this.completeLevel();
                }
            }

            paintBlank(position, element) {
                const item = document.querySelector(`.pattern-item[data-pos="${position}"]`);
                if (!item) return;
                item.classList.remove('blank');
                item.classList.add('filled');
                item.textContent = element;
            }

            completeLevel() {
                this.score += 10 * this.currentLevel;
                this.updateStats();

                const accuracy = this.blanks.length / (this.blanks.length + this.misses);
                const stars = KidsUI.Progress.starsFor(accuracy);
                KidsUI.Progress.record(this.gameId, { stars, best: this.currentLevel });

                const isLast = this.currentLevel >= this.maxLevels;
                KidsUI.Celebrate.show({
                    title: isLast ? '全部过关！🏆' : '补上啦！',
                    sub: `第 ${this.currentLevel} 关 · 得分 ${this.score}`,
                    stars,
                    primaryLabel: isLast ? '再玩一轮' : '下一关 →',
                    onPrimary: () => this.startLevel(isLast ? 1 : this.currentLevel + 1),
                    announce: isLast ? '太厉害了，全部关卡都完成啦！' : '太棒了！'
                });
            }

            updateStats() {
                document.getElementById('correct-count').textContent = `${this.filled.size}/${this.blanks.length}`;
                document.getElementById('score').textContent = this.score;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new PatternMatchGame();
        });
    </script>
</body>
</html>
