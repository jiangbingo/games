<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#e63946">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="看图识物">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>看图识物</title>
  <link rel="stylesheet" href="/css/kids.css">
  <style>
    :root {
      --game-accent: #e63946;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--kui-paper);
      background-image: radial-gradient(rgba(47, 42, 37, 0.03) 1px, transparent 1.4px);
      background-size: 26px 26px;
      min-height: 100vh;
      color: var(--kui-ink);
      display: flex;
      justify-content: center;
      padding: 14px;
      touch-action: manipulation;
    }
    .game {
      background: var(--kui-card);
      border: 2px solid var(--kui-line);
      border-radius: var(--kui-radius-lg);
      box-shadow: var(--kui-shadow);
      max-width: 500px;
      width: 100%;
      padding: 20px;
      margin-top: 8px;
    }
    .categories {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }
    .cat-btn {
      flex: 1;
      padding: 12px 6px;
      border: 2px solid var(--kui-line);
      border-radius: var(--kui-radius-md);
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      background: var(--kui-paper);
      color: var(--kui-ink);
      box-shadow: var(--kui-shadow);
      transition: transform 0.12s var(--kui-bounce), box-shadow 0.12s;
    }
    .cat-btn:active { transform: translateY(2px); box-shadow: none; }
    .cat-btn.active {
      color: #fff;
      border-color: rgba(47, 42, 37, 0.2);
    }
    .cat-btn[data-cat="animals"].active { background: #e63946; }
    .cat-btn[data-cat="fruits"].active { background: #3fa574; }
    .cat-btn[data-cat="vehicles"].active { background: #4f8ff7; }

    .score-board {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .target-area {
      text-align: center;
      margin-bottom: 18px;
    }
    .target-emoji {
      font-size: clamp(84px, 24vw, 120px);
      line-height: 1.1;
      margin-bottom: 8px;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .target-name {
      font-size: clamp(1.5rem, 6vw, 2rem);
      font-weight: 900;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }
    .option-btn {
      aspect-ratio: 1;
      min-height: 96px;
      font-size: clamp(44px, 13vw, 64px);
      border: 3px solid var(--kui-line);
      border-radius: var(--kui-radius-md);
      background: var(--kui-paper);
      cursor: pointer;
      box-shadow: var(--kui-shadow);
      transition: transform 0.12s var(--kui-bounce), box-shadow 0.12s, border-color 0.2s;
    }
    .option-btn:active { transform: translateY(2px); box-shadow: none; }
    .option-btn.correct {
      background: #eaf7f0;
      border-color: var(--kui-good);
      animation: pop 0.35s var(--kui-bounce);
    }
    .option-btn.wrong {
      opacity: 0.45;
      border-color: var(--kui-bad);
      border-style: dashed;
      pointer-events: none;
      animation: shake 0.35s ease;
    }
    @keyframes pop {
      0% { transform: scale(0.9); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .feedback {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 900;
      min-height: 2em;
      color: var(--kui-ink-soft);
    }

    .level-hint {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--game-accent);
      margin-top: -8px;
      margin-bottom: 14px;
    }

    @media (prefers-reduced-motion: reduce) {
      .target-emoji, .option-btn, .cat-btn { animation: none; transition: none; }
    }
  </style>
</head>
<body>
  <div class="game">
    <div class="categories">
      <button class="cat-btn active" data-cat="animals" type="button">🐾 动物</button>
      <button class="cat-btn" data-cat="fruits" type="button">🍎 水果</button>
      <button class="cat-btn" data-cat="vehicles" type="button">🚗 交通</button>
    </div>

    <div class="score-board">
      <span class="kui-chip">✅ 答对 <b id="correct">0</b></span>
      <span class="kui-chip">🤔 试错 <b id="wrong">0</b></span>
    </div>

    <div class="target-area">
      <div class="target-emoji" id="target-emoji">🐶</div>
      <div class="target-name" id="target-name">小狗</div>
      <div class="level-hint" id="level-hint"></div>
    </div>

    <div class="options" id="options"></div>

    <div class="feedback" id="feedback" aria-live="polite">点一个一样的！</div>
  </div>

<script src="/js/kids-ui.js"></script>
    <script src="/pwa.js" defer></script>
    <script>
      // 游戏数据
      const DATA = {
        animals: [
          { emoji: '🐶', name: '小狗' },
          { emoji: '🐱', name: '小猫' },
          { emoji: '🐰', name: '兔子' },
          { emoji: '🦊', name: '狐狸' },
          { emoji: '🐻', name: '小熊' },
          { emoji: '🐼', name: '熊猫' }
        ],
        fruits: [
          { emoji: '🍎', name: '苹果' },
          { emoji: '🍊', name: '橘子' },
          { emoji: '🍋', name: '柠檬' },
          { emoji: '🍇', name: '葡萄' },
          { emoji: '🍓', name: '草莓' },
          { emoji: '🍑', name: '桃子' }
        ],
        vehicles: [
          { emoji: '🚗', name: '汽车' },
          { emoji: '🚌', name: '公交车' },
          { emoji: '🚔', name: '警车' },
          { emoji: '🚑', name: '救护车' },
          { emoji: '🚒', name: '消防车' },
          { emoji: '🚕', name: '出租车' }
        ]
      };

      const CELEBRATE_EVERY = 10;

      /**
       * 看图识物：自适应难度 —— 选项数随答题率在 3/4/5 之间升降。
       * 答错留在本题重试（幼儿友好），难度只在「完成一道题」时评估。
       */
      class PictureRecognitionGame {
        constructor() {
          this.gameId = 'picture-recognition';
          this.score = { correct: 0, wrong: 0 };
          this.cycleCorrect = 0;
          this.cycleWrong = 0;
          this.currentCategory = 'animals';
          this.currentTarget = null;
          this.canClick = true;
          this.roundMissed = false;

          // 难度 → 选项数（至少含 1 个正确 + 其余干扰项）
          this.OPTION_COUNTS = [3, 4, 5];

          this.difficulty = new KidsUI.AdaptiveDifficulty({
            windowSize: 5,
            thresholds: { easy: 0.8, hard: 0.5 },
            initialLevel: 1,
            onChange: (level) => this.onDifficultyChange(level)
          });

          this.init();
        }

        init() {
          KidsUI.Touch.guard();
          KidsUI.Header.render({
            title: '看图识物',
            accent: '#e63946',
            onReplay: () => this.startGame(this.currentCategory)
          });
          document.querySelectorAll('.cat-btn').forEach((btn) => {
            btn.addEventListener('click', () => this.startGame(btn.dataset.cat));
          });
          this.startGame(this.currentCategory);
        }

        startGame(category) {
          this.currentCategory = category;
          this.score = { correct: 0, wrong: 0 };
          this.cycleCorrect = 0;
          this.cycleWrong = 0;
          this.difficulty.reset();
          this.updateScore();
          this.updateLevelHint();
          document.querySelectorAll('.cat-btn').forEach((btn) => {
            btn.classList.toggle('active', btn.dataset.cat === category);
          });
          KidsUI.SFX.tap();
          this.nextRound();
        }

        onDifficultyChange(level) {
          // 只更新提示栏；下一题由 check() 里的 setTimeout(nextRound) 走完，避免重复出题
          this.updateLevelHint();
        }

        updateLevelHint() {
          const level = this.difficulty.getLevel();
          const optionCount = this.OPTION_COUNTS[level - 1] || 3;
          const labels = ['🐾 小小挑战', '🔍 有点难啦', '🌟 火眼金睛'];
          document.getElementById('level-hint').textContent =
            `${labels[level - 1]} · 从 ${optionCount} 个里选`;
        }

        optionCount() {
          return this.OPTION_COUNTS[this.difficulty.getLevel() - 1] || 3;
        }

        nextRound() {
          this.canClick = true;
          this.roundMissed = false;
          const fb = document.getElementById('feedback');
          fb.textContent = '点一个一样的！';

          const items = DATA[this.currentCategory];
          this.currentTarget = items[Math.floor(Math.random() * items.length)];

          document.getElementById('target-emoji').textContent = this.currentTarget.emoji;
          document.getElementById('target-name').textContent = this.currentTarget.name;

          const options = [this.currentTarget];
          const others = items.filter((item) => item !== this.currentTarget);
          const targetCount = this.optionCount();
          while (options.length < targetCount && others.length) {
            const idx = Math.floor(Math.random() * others.length);
            options.push(others.splice(idx, 1)[0]);
          }
          options.sort(() => Math.random() - 0.5);

          const optionsDiv = document.getElementById('options');
          optionsDiv.innerHTML = options
            .map((item) => `<button class="option-btn" type="button" data-emoji="${item.emoji}">${item.emoji}</button>`)
            .join('');
          optionsDiv.querySelectorAll('.option-btn').forEach((btn) => {
            btn.addEventListener('click', () => this.check(btn));
          });
        }

        // 答错：该选项划掉，留在本题重试（幼儿友好）
        check(btn) {
          if (!this.canClick) return;

          if (btn.dataset.emoji === this.currentTarget.emoji) {
            this.canClick = false;
            btn.classList.add('correct');
            this.score.correct++;
            this.cycleCorrect++;
            KidsUI.SFX.correct();
            KidsUI.haptic('good');
            KidsUI.TTS.speak(this.currentTarget.name);
            document.getElementById('feedback').textContent = `对啦！这是${this.currentTarget.name}`;
            this.updateScore();

            // 完成一道题后才评估难度：本题一次未错记通过，错过则记不通过（可降级）
            this.difficulty.record(!this.roundMissed);

            if (this.cycleCorrect >= CELEBRATE_EVERY) {
              this.cycleCorrect = 0;
              this.cycleWrong = 0;
              const stars = KidsUI.Progress.starsFor(this.score.correct / (this.score.correct + this.score.wrong));
              KidsUI.Progress.record(this.gameId, { stars, best: this.score.correct });
              KidsUI.Celebrate.show({
                title: '真厉害！',
                sub: `已经答对 ${this.score.correct} 题`,
                stars,
                primaryLabel: '继续玩',
                onPrimary: () => this.nextRound()
              });
              return;
            }
            setTimeout(() => this.nextRound(), 1200);
          } else {
            this.score.wrong++;
            this.cycleWrong++;
            btn.classList.add('wrong');
            KidsUI.SFX.wrong();
            KidsUI.haptic('bad');
            document.getElementById('feedback').textContent = '🤔 再找一个一样的';
            this.updateScore();
            // 留在本题重试，完成本题时才把「错过」计入难度
            this.roundMissed = true;
          }
        }

        updateScore() {
          document.getElementById('correct').textContent = this.score.correct;
          document.getElementById('wrong').textContent = this.score.wrong;
        }
      }

      window.addEventListener('DOMContentLoaded', () => {
        new PictureRecognitionGame();
      });
    </script>
</body>
</html>
