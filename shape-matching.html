<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#43aa8b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="形状配对">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title>形状配对 - 儿童游戏</title>
    <link rel="stylesheet" href="/css/kids.css">
    <style>
        :root {
            --game-accent: #43aa8b;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--kui-paper);
            background-image: radial-gradient(rgba(47, 42, 37, 0.03) 1px, transparent 1.4px);
            background-size: 26px 26px;
            min-height: 100vh;
            color: var(--kui-ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .game-container {
            background: var(--kui-card);
            border: 2px solid var(--kui-line);
            border-radius: var(--kui-radius-lg);
            box-shadow: var(--kui-shadow);
            max-width: 560px;
            width: 100%;
            text-align: center;
            padding: 22px 22px 26px;
            margin-top: 8px;
        }

        .instruction {
            font-size: clamp(1.1rem, 4vw, 1.4rem);
            font-weight: 800;
            color: var(--kui-ink);
            margin-bottom: 8px;
        }

        .target-shape {
            margin: 18px auto;
            width: clamp(120px, 34vw, 170px);
            animation: bounce 1.2s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin: 18px 0;
        }

        .shape-btn {
            padding: 14px;
            border: 2px solid var(--kui-line);
            border-radius: var(--kui-radius-md);
            background: var(--kui-paper);
            cursor: pointer;
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--kui-shadow);
            transition: transform 0.12s var(--kui-bounce), box-shadow 0.12s;
            touch-action: manipulation;
        }
        .shape-btn:active { transform: translateY(2px); box-shadow: none; }
        .shape-btn svg { width: 100%; height: auto; max-height: 76px; }

        .shape-btn.wrong {
            animation: shake 0.4s ease;
            border-color: var(--kui-bad);
        }
        .shape-btn.right {
            border-color: var(--kui-good);
            background: #eaf7f0;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .feedback {
            font-size: 1.3rem;
            min-height: 2em;
            margin: 10px 0;
            font-weight: 900;
        }
        .feedback.success { color: var(--kui-good); animation: pop 0.4s var(--kui-bounce); }
        .feedback.retry { color: #d98a00; }

        @keyframes pop {
            0% { transform: scale(0.8); }
            100% { transform: scale(1); }
        }

        .stats-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 8px;
        }

        @media (prefers-reduced-motion: reduce) {
            .target-shape, .shape-btn, .feedback { animation: none; transition: none; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <p class="instruction">👇 找到和上面<b>一模一样</b>的形状！</p>

        <div class="target-shape" id="targetShape" aria-label="目标形状"></div>

        <div class="options" id="optionsContainer"></div>

        <div class="feedback" id="feedback" aria-live="polite">点点对看！</div>

        <div class="stats-row">
            <span class="kui-chip">🏆 得分 <b id="score">0</b></span>
            <span class="kui-chip">🎯 连对 <b id="streak">0</b></span>
        </div>
    </div>

    <script src="/js/kids-ui.js"></script>
    <script src="/pwa.js" defer></script>
    <script>
        // SVG 形状库：每个形状固定颜色，形状与颜色一一对应
        const SHAPES = {
            circle: { color: '#e5533d', svg: '<circle cx="50" cy="50" r="38" fill="COL"/>' },
            square: { color: '#4f8ff7', svg: '<rect x="14" y="14" width="72" height="72" rx="12" fill="COL"/>' },
            triangle: { color: '#3fa574', svg: '<path d="M50 12 L88 84 L12 84 Z" fill="COL"/>' },
            star: { color: '#ffb703', svg: '<path d="M50,10 L61.8,38.2 L92.4,38.2 L67.6,57 L76.8,86.8 L50,68 L23.2,86.8 L32.4,57 L7.6,38.2 L38.2,38.2 Z" fill="COL"/>' },
            heart: { color: '#e64980', svg: '<path d="M50,85 C25,65 12,48 12,34 C12,22 21,14 32,14 C40,14 46,18 50,25 C54,18 60,14 68,14 C79,14 88,22 88,34 C88,48 75,65 50,85 Z" fill="COL"/>' },
            diamond: { color: '#9b5de5', svg: '<path d="M50 10 L88 50 L50 90 L12 50 Z" fill="COL"/>' }
        };
        const SHAPE_KEYS = Object.keys(SHAPES);
        const CELEBRATE_EVERY = 5;
        const gameId = 'shape-matching';

        let currentTarget = '';
        let score = 0;
        let streak = 0;
        let roundCorrect = 0;
        let roundMistakes = 0;
        let isAnimating = false;

        function svgFor(key) {
            const s = SHAPES[key];
            return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${s.svg.replace('COL', s.color)}</svg>`;
        }

        function generateNewRound() {
            isAnimating = false;
            currentTarget = SHAPE_KEYS[Math.floor(Math.random() * SHAPE_KEYS.length)];
            document.getElementById('targetShape').innerHTML = svgFor(currentTarget);

            const options = [currentTarget];
            const others = SHAPE_KEYS.filter((k) => k !== currentTarget);
            while (options.length < 3) {
                const pick = others[Math.floor(Math.random() * others.length)];
                if (!options.includes(pick)) options.push(pick);
            }
            options.sort(() => Math.random() - 0.5);

            const container = document.getElementById('optionsContainer');
            container.innerHTML = options
                .map((k) => `<button class="shape-btn" type="button" data-shape="${k}" aria-label="形状选项">${svgFor(k)}</button>`)
                .join('');
            container.querySelectorAll('.shape-btn').forEach((btn) => {
                btn.addEventListener('click', () => checkShape(btn));
            });

            const fb = document.getElementById('feedback');
            fb.textContent = '点点对看！';
            fb.className = 'feedback';
        }

        function checkShape(button) {
            if (isAnimating) return;
            const feedback = document.getElementById('feedback');

            if (button.dataset.shape === currentTarget) {
                isAnimating = true;
                button.classList.add('right');
                feedback.textContent = '✅ 真棒！';
                feedback.className = 'feedback success';
                score += 10;
                streak++;
                roundCorrect++;
                KidsUI.SFX.correct();
                KidsUI.haptic('good');
                updateStats();

                if (streak % CELEBRATE_EVERY === 0) {
                    const stars = KidsUI.Progress.starsFor(roundCorrect / (roundCorrect + roundMistakes));
                    roundCorrect = 0;
                    roundMistakes = 0;
                    KidsUI.Progress.record(gameId, { stars, best: score });
                    KidsUI.Celebrate.show({
                        title: '太棒了！',
                        sub: `连对 ${streak} 题 · 得分 ${score}`,
                        stars,
                        primaryLabel: '继续玩',
                        onPrimary: () => generateNewRound()
                    });
                    return;
                }
                setTimeout(generateNewRound, 800);
            } else {
                roundMistakes++;
                streak = 0;
                feedback.textContent = '🤔 再试试～';
                feedback.className = 'feedback retry';
                button.classList.add('wrong');
                KidsUI.SFX.wrong();
                KidsUI.haptic('bad');
                setTimeout(() => button.classList.remove('wrong'), 450);
                updateStats();
            }
        }

        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('streak').textContent = streak;
        }

        function restartGame() {
            score = 0;
            streak = 0;
            roundCorrect = 0;
            roundMistakes = 0;
            updateStats();
            generateNewRound();
        }

        window.addEventListener('DOMContentLoaded', () => {
            KidsUI.Touch.guard();
            KidsUI.Header.render({
                title: '形状配对',
                accent: '#43aa8b',
                onReplay: restartGame
            });
            restartGame();
        });
    </script>
</body>
</html>
