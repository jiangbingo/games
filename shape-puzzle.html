<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#f2994a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="形状拼拼乐">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title>形状拼拼乐 - 儿童逻辑思维游戏</title>
    <link rel="stylesheet" href="/css/kids.css">
    <style>
        :root {
            --game-accent: #f2994a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--kui-paper);
            background-image: radial-gradient(rgba(47, 42, 37, 0.03) 1px, transparent 1.4px);
            background-size: 26px 26px;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--kui-ink);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        #app {
            max-width: 700px;
            margin: 0 auto;
            padding: 14px 14px 30px;
        }

        .game-container {
            background: var(--kui-card);
            border: 2px solid var(--kui-line);
            border-radius: var(--kui-radius-lg);
            box-shadow: var(--kui-shadow);
            padding: 16px;
        }

        .mode-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .preset-name {
            font-size: 1.05rem;
            font-weight: 900;
        }
        .mode-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
        .mode-btn {
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 800;
            border: 2px solid var(--kui-line);
            border-radius: 999px;
            background: var(--kui-paper);
            color: var(--kui-ink);
            cursor: pointer;
            box-shadow: var(--kui-shadow);
            touch-action: manipulation;
        }
        .mode-btn:active { transform: translateY(2px); box-shadow: none; }
        .mode-btn.active {
            background: var(--game-accent);
            color: #fff;
            border-color: rgba(47, 42, 37, 0.2);
        }

        .diff-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 14px;
        }
        .diff-btn {
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 2px solid var(--kui-line);
            border-radius: 999px;
            background: var(--kui-paper);
            color: var(--kui-ink-soft);
            cursor: pointer;
            touch-action: manipulation;
        }
        .diff-btn:active { transform: translateY(2px); }
        .diff-btn.active {
            background: var(--game-accent);
            color: #fff;
            border-color: rgba(47, 42, 37, 0.2);
        }

        .target-area { text-align: center; }
        .target-label {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--kui-ink-soft);
            margin-bottom: 10px;
        }
        .target-canvas {
            border: 3px dashed var(--game-accent);
            border-radius: var(--kui-radius-md);
            background: var(--kui-paper);
            margin: 0 auto;
            display: block;
            width: min(300px, 82vw);
            height: auto;
            touch-action: none;
        }

        .pieces-area { margin-top: 16px; }
        .pieces-label {
            text-align: center;
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--kui-ink-soft);
            margin-bottom: 10px;
        }
        .pieces-grid {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 8px 10px;
            scroll-snap-type: x mandatory;
        }
        .pieces-grid::-webkit-scrollbar { height: 4px; }
        .pieces-grid::-webkit-scrollbar-track { background: var(--kui-line); border-radius: 2px; }
        .pieces-grid::-webkit-scrollbar-thumb { background: var(--game-accent); border-radius: 2px; }

        .piece-btn {
            width: 72px;
            height: 72px;
            min-width: 72px;
            scroll-snap-align: center;
            background: var(--kui-paper);
            border: 2px solid var(--kui-line);
            border-radius: var(--kui-radius-md);
            cursor: grab;
            box-shadow: var(--kui-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            touch-action: none;
            transition: transform 0.12s var(--kui-bounce), box-shadow 0.12s;
        }
        .piece-btn:hover { transform: translateY(-3px); }
        .piece-btn:active { cursor: grabbing; }
        .piece-btn.bounce-back {
            animation: bounceBack 0.35s var(--kui-bounce);
        }
        @keyframes bounceBack {
            0% { transform: scale(1.1); }
            40% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        .piece-btn svg { width: 100%; height: 100%; }
        .piece-btn.placed {
            opacity: 0.35;
            pointer-events: none;
        }

        /* 拖拽中的跟手幽灵 */
        .drag-ghost {
            position: fixed;
            z-index: 1001;
            width: 64px;
            height: 64px;
            pointer-events: none;
            transform: translate(-50%, -55%) scale(1.05);
            filter: drop-shadow(0 6px 10px rgba(47, 42, 37, 0.3));
        }
        .drag-ghost svg { width: 100%; height: 100%; }

        .stats-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .action-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 14px;
        }
        .clear-btn {
            padding: 10px 22px;
            font-size: 0.95rem;
            font-weight: 800;
            border: 2px dashed var(--kui-line);
            border-radius: 999px;
            background: transparent;
            color: var(--kui-ink-soft);
            cursor: pointer;
            touch-action: manipulation;
        }
        .clear-btn:active { transform: translateY(2px); }

        @media (prefers-reduced-motion: reduce) {
            .piece-btn { transition: none; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="game-container">
            <div class="mode-row">
                <span class="preset-name" id="preset-name">🏠 小房子</span>
                <div class="mode-buttons">
                    <button class="mode-btn active" id="preset-btn" type="button">🧩 拼图</button>
                    <button class="mode-btn" id="free-btn" type="button">🎨 自由</button>
                </div>
            </div>

            <div class="diff-row" id="diff-row">
                <button class="diff-btn active" data-diff="easy" type="button">⭐ 简单</button>
                <button class="diff-btn" data-diff="normal" type="button">⭐⭐ 普通</button>
                <button class="diff-btn" data-diff="hard" type="button">⭐⭐⭐ 困难</button>
            </div>

            <div class="target-area">
                <div class="target-label" id="target-label">按住碎片，拖到虚线的位置上</div>
                <canvas id="target-canvas" class="target-canvas" width="300" height="300"></canvas>
            </div>

            <div class="pieces-area">
                <div class="pieces-label" id="pieces-label">形状碎片</div>
                <div class="pieces-grid" id="pieces-grid"></div>
            </div>

            <div class="stats-row">
                <span class="kui-chip">✅ 已拼 <b id="placed-count">0/0</b></span>
                <span class="kui-chip">🏆 得分 <b id="score">0</b></span>
            </div>

            <div class="action-row">
                <button class="clear-btn" id="clear-btn" type="button">🗑️ 清空重拼</button>
            </div>
        </div>
    </div>

    <script src="/js/kids-ui.js"></script>
    <script src="/pwa.js" defer></script>
    <script>
        /**
         * 形状拼拼乐：按住碎片直接拖到画布虚线处吸附。
         * 碎片数据坐标 = 中心点 (x, y)；画布 300x300。
         */

        // 碎片 SVG（按钮/幽灵用），与画布绘制形状一致
        function pieceSvg(type, color) {
            const stroke = 'stroke="rgba(47,42,37,0.35)" stroke-width="4"';
            let inner;
            switch (type) {
                case 'circle': inner = `<circle cx="50" cy="50" r="36" fill="${color}" ${stroke}/>`; break;
                case 'square': inner = `<rect x="16" y="16" width="68" height="68" rx="8" fill="${color}" ${stroke}/>`; break;
                case 'rectangle': inner = `<rect x="8" y="30" width="84" height="40" rx="8" fill="${color}" ${stroke}/>`; break;
                case 'triangle': inner = `<path d="M50 14 L88 82 L12 82 Z" fill="${color}" ${stroke}/>`; break;
                case 'star': inner = `<path d="M50,10 L61.8,38.2 L92.4,38.2 L67.6,57 L76.8,86.8 L50,68 L23.2,86.8 L32.4,57 L7.6,38.2 L38.2,38.2 Z" fill="${color}" ${stroke}/>`; break;
                default: inner = `<circle cx="50" cy="50" r="36" fill="${color}" ${stroke}/>`;
            }
            return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;
        }

        class ShapePuzzleGame {
            constructor() {
                this.canvas = document.getElementById('target-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.currentMode = 'preset';
                this.currentDifficulty = 'easy';
                this.currentPreset = null;
                this.pieces = [];
                this.placedPieces = [];
                this.score = 0;
                this.misses = 0;
                this.snapDistance = 32;
                this.gameId = 'shape-puzzle';
                this.drag = null;

                // 难度配置
                this.difficulty = {
                    easy: { snapDistance: 40, showHint: true, label: '简单' },
                    normal: { snapDistance: 28, showHint: false, label: '普通' },
                    hard: { snapDistance: 18, showHint: false, label: '困难' }
                };

                this.presetShapes = [
                    { name: '🏠 小房子', pieces: [
                        { type: 'square', color: '#e74c3c', x: 150, y: 65, width: 70, height: 70 },
                        { type: 'triangle', color: '#3498db', x: 150, y: 125, width: 70, height: 45 },
                        { type: 'rectangle', color: '#f1c40f', x: 150, y: 165, width: 24, height: 30 }
                    ]},
                    { name: '🌳 小树', pieces: [
                        { type: 'rectangle', color: '#8b4513', x: 150, y: 170, width: 18, height: 70 },
                        { type: 'circle', color: '#27ae60', x: 150, y: 105, width: 80, height: 80 }
                    ]},
                    { name: '⛵ 小船', pieces: [
                        { type: 'triangle', color: '#e74c3c', x: 150, y: 105, width: 70, height: 60 },
                        { type: 'rectangle', color: '#3498db', x: 150, y: 165, width: 120, height: 18 }
                    ]},
                    { name: '🏰 大城堡', pieces: [
                        { type: 'square', color: '#9b59b6', x: 150, y: 70, width: 50, height: 50 },
                        { type: 'square', color: '#9b59b6', x: 105, y: 75, width: 36, height: 36 },
                        { type: 'square', color: '#9b59b6', x: 195, y: 75, width: 36, height: 36 },
                        { type: 'triangle', color: '#e74c3c', x: 150, y: 130, width: 130, height: 45 },
                        { type: 'rectangle', color: '#3498db', x: 150, y: 185, width: 30, height: 44 }
                    ]},
                    { name: '🌸 花朵', pieces: [
                        { type: 'circle', color: '#f1c40f', x: 150, y: 95, width: 50, height: 50 },
                        { type: 'circle', color: '#e64980', x: 150, y: 82, width: 26, height: 26 },
                        { type: 'circle', color: '#e64980', x: 124, y: 108, width: 22, height: 22 },
                        { type: 'circle', color: '#e64980', x: 176, y: 108, width: 22, height: 22 },
                        { type: 'rectangle', color: '#27ae60', x: 150, y: 160, width: 10, height: 70 }
                    ]},
                    { name: '🚗 汽车', pieces: [
                        { type: 'rectangle', color: '#3498db', x: 150, y: 120, width: 110, height: 44 },
                        { type: 'circle', color: '#2ecc71', x: 105, y: 165, width: 30, height: 30 },
                        { type: 'circle', color: '#2ecc71', x: 195, y: 165, width: 30, height: 30 },
                        { type: 'square', color: '#f1c40f', x: 150, y: 120, width: 30, height: 30 }
                    ]},
                    { name: '🚀 火箭', pieces: [
                        { type: 'triangle', color: '#3498db', x: 150, y: 55, width: 40, height: 40 },
                        { type: 'rectangle', color: '#e74c3c', x: 150, y: 120, width: 44, height: 90 },
                        { type: 'circle', color: '#f1c40f', x: 150, y: 115, width: 22, height: 22 },
                        { type: 'triangle', color: '#2ecc71', x: 128, y: 200, width: 26, height: 26 },
                        { type: 'triangle', color: '#2ecc71', x: 172, y: 200, width: 26, height: 26 }
                    ]},
                    { name: '⭐ 星星城堡', pieces: [
                        { type: 'star', color: '#ffb703', x: 150, y: 70, width: 60, height: 60 },
                        { type: 'square', color: '#9b59b6', x: 150, y: 140, width: 70, height: 60 },
                        { type: 'rectangle', color: '#3498db', x: 150, y: 205, width: 34, height: 40 }
                    ]}
                ];

                this.freePieces = [
                    { type: 'square', color: '#e74c3c', width: 44, height: 44 },
                    { type: 'circle', color: '#3498db', width: 44, height: 44 },
                    { type: 'triangle', color: '#2ecc71', width: 46, height: 42 },
                    { type: 'rectangle', color: '#f1c40f', width: 60, height: 32 },
                    { type: 'star', color: '#9b59b6', width: 46, height: 46 },
                    { type: 'square', color: '#e67e22', width: 44, height: 44 }
                ];

                this.init();
            }

            init() {
                KidsUI.Touch.guard();
                KidsUI.Header.render({
                    title: '形状拼拼乐',
                    accent: '#f2994a',
                    onReplay: () => this.restart()
                });
                this.bindEvents();
                this.startPresetMode();
            }

            bindEvents() {
                document.getElementById('preset-btn').addEventListener('click', () => {
                    KidsUI.SFX.tap();
                    this.switchMode('preset');
                });
                document.getElementById('free-btn').addEventListener('click', () => {
                    KidsUI.SFX.tap();
                    this.switchMode('free');
                });
                document.getElementById('clear-btn').addEventListener('click', () => {
                    KidsUI.SFX.tap();
                    this.clearBoard();
                });

                // 难度选择
                document.querySelectorAll('.diff-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        KidsUI.SFX.tap();
                        this.currentDifficulty = btn.dataset.diff;
                        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.restart();
                    });
                });

                window.addEventListener('pointermove', (e) => this.handleDragMove(e));
                window.addEventListener('pointerup', (e) => this.handleDragEnd(e));
                window.addEventListener('pointercancel', (e) => this.handleDragEnd(e));
            }

            switchMode(mode) {
                this.currentMode = mode;
                document.getElementById('preset-btn').classList.toggle('active', mode === 'preset');
                document.getElementById('free-btn').classList.toggle('active', mode === 'free');
                if (mode === 'preset') this.startPresetMode();
                else this.startFreeMode();
            }

            restart() {
                if (this.currentMode === 'preset') this.startPresetMode();
                else this.startFreeMode();
            }

            startPresetMode() {
                const last = this.currentPreset;
                let next;
                do {
                    next = this.presetShapes[Math.floor(Math.random() * this.presetShapes.length)];
                } while (this.presetShapes.length > 1 && next === last);
                this.currentPreset = next;
                this.pieces = [...next.pieces];
                this.placedPieces = [];
                this.misses = 0;
                this.snapDistance = this.difficulty[this.currentDifficulty].snapDistance;
                document.getElementById('preset-name').textContent = next.name;
                document.getElementById('target-label').textContent = '按住碎片，拖到虚线的位置上';
                document.getElementById('pieces-label').textContent = '形状碎片（按住拖动）';
                this.renderAll();
            }

            startFreeMode() {
                this.currentPreset = null;
                this.pieces = [...this.freePieces];
                this.placedPieces = [];
                document.getElementById('preset-name').textContent = '🎨 自由拼搭';
                document.getElementById('target-label').textContent = '把碎片拖进画布，拼出你的画';
                document.getElementById('pieces-label').textContent = '形状碎片（按住拖动）';
                this.renderAll();
            }

            clearBoard() {
                this.placedPieces = [];
                this.renderAll();
            }

            renderAll() {
                this.renderTarget();
                this.renderPieces();
                this.updateStats();
            }

            renderTarget() {
                const ctx = this.ctx;
                ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                ctx.save();

                if (this.currentMode === 'preset') {
                    // 未拼上的位置画虚线幽灵，已拼上的画实心
                    this.pieces.forEach((piece, index) => {
                        const placed = this.placedPieces.includes(index);
                        if (placed) {
                            this.drawPiece(ctx, piece, piece.x, piece.y, 1, false);
                        } else {
                            this.drawPiece(ctx, piece, piece.x, piece.y, 0.32, true);
                        }
                    });
                } else {
                    this.placedPieces.forEach((p) => {
                        this.drawPiece(ctx, p.piece, p.x, p.y, 1, false);
                    });
                }
                ctx.restore();
            }

            renderPieces() {
                const container = document.getElementById('pieces-grid');
                container.innerHTML = '';
                this.pieces.forEach((piece, index) => {
                    const placed = this.currentMode === 'preset'
                        ? this.placedPieces.includes(index)
                        : false;
                    const btn = document.createElement('button');
                    btn.className = 'piece-btn' + (placed ? ' placed' : '');
                    btn.type = 'button';
                    btn.setAttribute('aria-label', '形状碎片');
                    btn.innerHTML = pieceSvg(piece.type, piece.color);
                    if (!placed) {
                        btn.addEventListener('pointerdown', (e) => this.handleDragStart(e, index, btn));
                    }
                    container.appendChild(btn);
                });
            }

            updateStats() {
                const placed = this.placedPieces.length;
                const total = this.currentMode === 'preset' ? this.pieces.length : '∞';
                document.getElementById('placed-count').textContent = `${placed}/${total}`;
                document.getElementById('score').textContent = this.score;
            }

            // ── 按住即拖：pointer 事件三件套 ──

            handleDragStart(e, index, btn) {
                if (this.drag) return;
                if (e.button !== undefined && e.button !== 0) return;
                e.preventDefault();
                const piece = this.pieces[index];
                this.drag = { piece, index, active: true, btn };

                const ghost = document.createElement('div');
                ghost.className = 'drag-ghost';
                ghost.innerHTML = pieceSvg(piece.type, piece.color);
                document.body.appendChild(ghost);
                this.drag.ghost = ghost;
                btn.classList.add('placed');
                this.moveGhost(e);

                // 简单模式：高亮目标位置
                if (this.currentMode === 'preset' && this.difficulty[this.currentDifficulty].showHint) {
                    this.drawHint(piece);
                }
            }

            moveGhost(e) {
                const g = this.drag && this.drag.ghost;
                if (!g) return;
                g.style.left = e.clientX + 'px';
                g.style.top = e.clientY + 'px';
            }

            handleDragMove(e) {
                if (!this.drag) return;
                this.moveGhost(e);
            }

            toCanvasXY(e) {
                const rect = this.canvas.getBoundingClientRect();
                return {
                    x: (e.clientX - rect.left) * (this.canvas.width / rect.width),
                    y: (e.clientY - rect.top) * (this.canvas.height / rect.height),
                    inside: e.clientX >= rect.left && e.clientX <= rect.right &&
                            e.clientY >= rect.top && e.clientY <= rect.bottom
                };
            }

            handleDragEnd(e) {
                if (!this.drag) return;
                const { piece, index } = this.drag;
                this.drag.ghost.remove();
                this.drag = null;

                const pt = this.toCanvasXY(e);

                if (this.currentMode === 'preset') {
                    if (pt.inside && Math.hypot(pt.x - piece.x, pt.y - piece.y) < this.snapDistance) {
                        this.placedPieces.push(index);
                        this.score += 10;
                        KidsUI.SFX.correct();
                        KidsUI.haptic('good');
                        this.renderAll();
                        if (this.placedPieces.length === this.pieces.length) this.completePuzzle();
                    } else {
                        this.misses++;
                        KidsUI.SFX.wrong();
                        KidsUI.haptic('bad');
                        this.renderAll();
                        this.bouncePiece(index);
                    }
                } else {
                    if (pt.inside) {
                        this.placedPieces.push({ piece, x: pt.x, y: pt.y });
                        this.score += 5;
                        KidsUI.SFX.correct();
                        KidsUI.haptic('good');
                        this.renderAll();
                    } else {
                        KidsUI.SFX.wrong();
                        KidsUI.haptic('bad');
                        this.renderAll();
                        this.bouncePiece(index);
                    }
                }
            }

            // renderAll 会整体重建碎片托盘，拖拽时的旧按钮引用已断连，须按索引取活节点
            bouncePiece(index) {
                requestAnimationFrame(() => {
                    const live = document.getElementById('pieces-grid').children[index];
                    if (!live) return;
                    live.classList.add('bounce-back');
                    setTimeout(() => live.classList.remove('bounce-back'), 350);
                });
            }

            completePuzzle() {
                const accuracy = this.pieces.length / (this.pieces.length + this.misses);
                const stars = KidsUI.Progress.starsFor(accuracy);
                KidsUI.Progress.record(this.gameId, { stars, best: this.score });
                KidsUI.Celebrate.show({
                    title: '拼好啦！',
                    sub: this.currentPreset.name + ' · 得分 ' + this.score,
                    stars,
                    primaryLabel: '再拼一个',
                    onPrimary: () => this.startPresetMode(),
                    announce: '太棒了，拼好啦！'
                });
            }

            drawPiece(ctx, piece, cx, cy, alpha, ghost) {
                ctx.save();
                ctx.globalAlpha = alpha;
                if (ghost) {
                    ctx.setLineDash([7, 5]);
                    ctx.strokeStyle = 'rgba(47, 42, 37, 0.5)';
                    ctx.fillStyle = 'rgba(47, 42, 37, 0.05)';
                    ctx.lineWidth = 2.5;
                } else {
                    ctx.strokeStyle = 'rgba(47, 42, 37, 0.5)';
                    ctx.fillStyle = piece.color;
                    ctx.lineWidth = 2;
                }
                const w = piece.width, h = piece.height;

                switch (piece.type) {
                    case 'circle':
                        ctx.beginPath();
                        ctx.arc(cx, cy, w / 2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        break;
                    case 'triangle':
                        ctx.beginPath();
                        ctx.moveTo(cx, cy - h / 2);
                        ctx.lineTo(cx - w / 2, cy + h / 2);
                        ctx.lineTo(cx + w / 2, cy + h / 2);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                        break;
                    case 'star': {
                        const outer = w / 2, inner = w / 4;
                        let rot = -Math.PI / 2;
                        ctx.beginPath();
                        ctx.moveTo(cx + Math.cos(rot) * outer, cy + Math.sin(rot) * outer);
                        for (let i = 0; i < 5; i++) {
                            rot += Math.PI / 5;
                            ctx.lineTo(cx + Math.cos(rot) * inner, cy + Math.sin(rot) * inner);
                            rot += Math.PI / 5;
                            ctx.lineTo(cx + Math.cos(rot) * outer, cy + Math.sin(rot) * outer);
                        }
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                        break;
                    }
                    default: // square / rectangle
                        ctx.beginPath();
                        ctx.rect(cx - w / 2, cy - h / 2, w, h);
                        ctx.fill();
                        ctx.stroke();
                }
                ctx.restore();
            }

            drawHint(piece) {
                const ctx = this.ctx;
                ctx.save();
                ctx.globalAlpha = 0.6;
                ctx.setLineDash([8, 4]);
                ctx.strokeStyle = '#f2994a';
                ctx.lineWidth = 3;
                const w = piece.width + 8, h = piece.height + 8;
                const cx = piece.x, cy = piece.y;
                ctx.beginPath();
                ctx.arc(cx, cy, Math.max(w, h) / 2 + 6, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new ShapePuzzleGame();
        });
    </script>
</body>
</html>
