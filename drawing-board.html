<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#457b9d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="涂鸦板">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title>涂鸦板 - 儿童逻辑思维游戏</title>
    <link rel="stylesheet" href="/css/kids.css">
    <style>
        :root {
            --game-accent: #457b9d;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            touch-action: none;
            background: var(--kui-paper);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas {
            display: block;
            background: #fff;
            touch-action: none;
        }

        .toolbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--kui-card);
            border-top: 2px solid var(--kui-line);
            padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            z-index: 100;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-label {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--kui-ink-soft);
        }

        .color-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 2px 0 rgba(47, 42, 37, 0.25);
            cursor: pointer;
            touch-action: manipulation;
        }

        .color-btn:active {
            transform: scale(0.92);
        }

        .color-btn.active {
            outline: 3px solid var(--kui-ink);
            outline-offset: 2px;
        }

        .size-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--kui-paper);
            border: 2px solid var(--kui-line);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .size-btn.active {
            background: var(--game-accent);
            border-color: var(--game-accent);
        }

        .size-btn .dot {
            background: var(--kui-ink);
            border-radius: 50%;
        }

        .size-btn.active .dot {
            background: #fff;
        }

        .size-small .dot { width: 8px; height: 8px; }
        .size-medium .dot { width: 14px; height: 14px; }
        .size-large .dot { width: 20px; height: 20px; }

        .action-btn {
            height: 42px;
            padding: 0 16px;
            border-radius: 21px;
            background: var(--kui-paper);
            border: 2px solid var(--kui-line);
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--kui-ink);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            touch-action: manipulation;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .btn-clear.armed {
            background: #fdeae7;
            border-color: var(--kui-bad);
            color: var(--kui-bad);
        }

        .toast {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(47, 42, 37, 0.85);
            color: #fff;
            padding: 14px 28px;
            border-radius: 20px;
            font-size: 1.05rem;
            font-weight: 700;
            z-index: 1000;
            pointer-events: none;
            transition: transform 0.3s var(--kui-bounce);
        }

        .toast.show {
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="toolbar" id="toolbar">
        <div class="tool-group" id="colorGroup">
            <span class="tool-label">颜色</span>
            <button type="button" class="color-btn active" data-color="#FF5252" style="background:#FF5252" aria-label="红色"></button>
            <button type="button" class="color-btn" data-color="#FF9800" style="background:#FF9800" aria-label="橙色"></button>
            <button type="button" class="color-btn" data-color="#FFEB3B" style="background:#FFEB3B" aria-label="黄色"></button>
            <button type="button" class="color-btn" data-color="#4CAF50" style="background:#4CAF50" aria-label="绿色"></button>
            <button type="button" class="color-btn" data-color="#2196F3" style="background:#2196F3" aria-label="蓝色"></button>
            <button type="button" class="color-btn" data-color="#9C27B0" style="background:#9C27B0" aria-label="紫色"></button>
        </div>

        <div class="tool-group" id="sizeGroup">
            <span class="tool-label">大小</span>
            <button type="button" class="size-btn size-small active" data-size="4" aria-label="细笔"><div class="dot"></div></button>
            <button type="button" class="size-btn size-medium" data-size="10" aria-label="中笔"><div class="dot"></div></button>
            <button type="button" class="size-btn size-large" data-size="18" aria-label="粗笔"><div class="dot"></div></button>
        </div>

        <div class="tool-group">
            <button type="button" class="action-btn" id="undoBtn">↩️ 撤销</button>
            <button type="button" class="action-btn btn-clear" id="clearBtn">🗑️ 清空</button>
            <button type="button" class="action-btn" id="saveBtn">💾 保存</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/js/kids-ui.js"></script>
    <script src="/pwa.js" defer></script>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const toast = document.getElementById('toast');

        const TOOLBAR_HEIGHT = 120;
        const UNDO_LIMIT = 10;
        const CLEAR_ARM_MS = 3000;

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let currentColor = '#FF5252';
        let currentSize = 4;
        let undoStack = [];
        let clearArmed = false;
        let clearTimer = null;

        function resizeCanvas() {
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            tempCtx.drawImage(canvas, 0, 0);

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.drawImage(tempCanvas, 0, 0);
            undoStack = [];

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentSize;
        }

        function startDrawing(x, y) {
            if (y > canvas.height - TOOLBAR_HEIGHT) return;

            pushUndo();
            isDrawing = true;
            lastX = x;
            lastY = y;

            ctx.beginPath();
            ctx.arc(x, y, currentSize / 2, 0, Math.PI * 2);
            ctx.fillStyle = currentColor;
            ctx.fill();
        }

        function draw(x, y) {
            if (!isDrawing) return;
            if (y > canvas.height - TOOLBAR_HEIGHT) {
                isDrawing = false;
                return;
            }

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentSize;
            ctx.stroke();

            lastX = x;
            lastY = y;
        }

        function stopDrawing() {
            isDrawing = false;
        }

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            startDrawing(touch.clientX - rect.left, touch.clientY - rect.top);
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            draw(touch.clientX - rect.left, touch.clientY - rect.top);
        }, { passive: false });

        canvas.addEventListener('touchend', stopDrawing);
        canvas.addEventListener('touchcancel', stopDrawing);

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            startDrawing(e.clientX - rect.left, e.clientY - rect.top);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            draw(e.clientX - rect.left, e.clientY - rect.top);
        });

        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        function bindToolbar() {
            document.querySelectorAll('.color-btn').forEach((btn) => {
                btn.addEventListener('click', () => {
                    currentColor = btn.dataset.color;
                    ctx.strokeStyle = currentColor;
                    document.querySelectorAll('.color-btn').forEach((b) => b.classList.remove('active'));
                    btn.classList.add('active');
                    KidsUI.SFX.tap();
                });
            });

            document.querySelectorAll('.size-btn').forEach((btn) => {
                btn.addEventListener('click', () => {
                    currentSize = Number(btn.dataset.size);
                    ctx.lineWidth = currentSize;
                    document.querySelectorAll('.size-btn').forEach((b) => b.classList.remove('active'));
                    btn.classList.add('active');
                    KidsUI.SFX.tap();
                });
            });

            document.getElementById('undoBtn').addEventListener('click', undo);
            document.getElementById('clearBtn').addEventListener('click', onClearTap);
            document.getElementById('saveBtn').addEventListener('click', saveCanvas);
        }

        function pushUndo() {
            undoStack.push(canvas.toDataURL('image/png'));
            if (undoStack.length > UNDO_LIMIT) undoStack.shift();
        }

        function undo() {
            const prev = undoStack.pop();
            if (!prev) {
                showToast('↩️ 没有可撤销的了');
                return;
            }
            const img = new Image();
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
            };
            img.src = prev;
            KidsUI.SFX.tap();
        }

        // 两步确认：先点一下进入待确认，3 秒内再点才真清空，防小朋友误触
        function onClearTap() {
            const btn = document.getElementById('clearBtn');
            if (!clearArmed) {
                clearArmed = true;
                btn.textContent = '⚠️ 再点一下清空';
                btn.classList.add('armed');
                KidsUI.SFX.tap();
                clearTimer = setTimeout(() => {
                    clearArmed = false;
                    btn.textContent = '🗑️ 清空';
                    btn.classList.remove('armed');
                }, CLEAR_ARM_MS);
                return;
            }

            clearTimeout(clearTimer);
            clearArmed = false;
            btn.textContent = '🗑️ 清空';
            btn.classList.remove('armed');
            undoStack = [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            KidsUI.SFX.tap();
            showToast('🗑️ 已清空');
        }

        function saveCanvas() {
            const link = document.createElement('a');
            link.download = `涂鸦_${new Date().toLocaleString('zh-CN').replace(/[/:]/g, '-')}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            KidsUI.SFX.tap();
            showToast('💾 已保存');
        }

        let toastTimer = null;

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 1500);
        }

        window.addEventListener('resize', resizeCanvas);

        document.addEventListener('DOMContentLoaded', () => {
            KidsUI.Touch.guard();
            KidsUI.Header.render({
                title: '涂鸦板',
                accent: '#457b9d',
                showReplay: false
            });
            bindToolbar();
            resizeCanvas();
        });
    </script>
</body>
</html>
