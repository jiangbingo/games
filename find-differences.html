<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#4f8ff7">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="找不同小侦探">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title>找不同小侦探 - 儿童逻辑思维游戏</title>
    <link rel="stylesheet" href="/css/kids.css">
    <style>
        :root {
            --game-accent: #4f8ff7;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--kui-paper);
            background-image: radial-gradient(rgba(47, 42, 37, 0.03) 1px, transparent 1.4px);
            background-size: 26px 26px;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--kui-ink);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        #app {
            max-width: 900px;
            margin: 0 auto;
            padding: 14px 14px 30px;
        }

        .game-container {
            background: var(--kui-card);
            border: 2px solid var(--kui-line);
            border-radius: var(--kui-radius-lg);
            box-shadow: var(--kui-shadow);
            padding: 18px;
        }

        .level-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            gap: 10px;
        }
        .level-badge {
            background: var(--game-accent);
            color: #fff;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 0.95rem;
            font-weight: 800;
            box-shadow: var(--kui-shadow);
        }
        .theme-name {
            font-size: 1rem;
            font-weight: 800;
            color: var(--kui-ink-soft);
        }

        .scene-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 18px;
        }

        .scene-panel {
            background: var(--kui-paper);
            border: 3px solid var(--kui-line);
            border-radius: var(--kui-radius-md);
            padding: 12px;
            position: relative;
            min-height: 280px;
        }

        .scene-panel.left {
            border-color: var(--game-accent);
        }

        .scene-panel.right {
            border-color: #c86bfa;
            cursor: pointer;
        }

        .scene-emoji {
            font-size: clamp(30px, 7vw, 54px);
            display: inline-block;
            margin: 6px;
            transition: transform 0.15s var(--kui-bounce);
        }

        .scene-emoji:hover {
            transform: scale(1.12);
        }

        .difference-marker {
            position: absolute;
            width: clamp(42px, 9vw, 64px);
            height: clamp(42px, 9vw, 64px);
            border: 4px solid #e74c3c;
            border-radius: 50%;
            pointer-events: none;
            animation: markerPop 0.3s ease;
        }

        @keyframes markerPop {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        .shake {
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .control-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .hint-btn {
            background: #ffd166;
            color: var(--kui-ink);
            border: 2px solid rgba(47, 42, 37, 0.2);
            padding: 12px 26px;
            border-radius: 999px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: var(--kui-shadow);
            transition: transform 0.12s var(--kui-bounce), box-shadow 0.12s;
            touch-action: manipulation;
        }
        .hint-btn:active { transform: translateY(2px); box-shadow: none; }
        .hint-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .skip-btn {
            background: var(--kui-card);
            color: var(--kui-ink);
            border: 2px dashed var(--kui-line);
            padding: 12px 26px;
            border-radius: 999px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            touch-action: manipulation;
        }
        .skip-btn:active { transform: translateY(2px); }

        .stats-area {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .scene-hint-note {
            text-align: center;
            color: var(--kui-ink-soft);
            font-size: 0.88rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .hint-highlight {
            position: absolute;
            width: clamp(46px, 9.5vw, 66px);
            height: clamp(46px, 9.5vw, 66px);
            border: 3px dashed #ffc107;
            border-radius: 12px;
            pointer-events: none;
            animation: hintPulse 1s ease-in-out 3;
        }

        @keyframes hintPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        @media (max-width: 768px) {
            .scene-container {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .scene-panel { min-height: 200px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .scene-emoji, .hint-btn, .skip-btn { transition: none; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="game-container">
            <div class="level-row">
                <span class="theme-name" id="theme-name">🐄 农场</span>
                <div class="level-badge" id="level-badge">第 1/5 关</div>
            </div>

            <p class="scene-hint-note">👀 右边这幅图有 <b id="diff-total">3</b> 处不一样，点一点找出来！</p>

            <div class="scene-container">
                <div class="scene-panel left" id="left-scene" aria-label="参照图"></div>
                <div class="scene-panel right" id="right-scene" aria-label="找不同"></div>
            </div>

            <div class="control-row">
                <button class="hint-btn" id="hint-btn" type="button">💡 提示 (<span id="hint-count">3</span>)</button>
                <button class="skip-btn" id="skip-btn" type="button">🔄 跳过这关</button>
            </div>

            <div class="stats-area">
                <span class="kui-chip">🔍 找到 <b id="found-count">0/3</b></span>
                <span class="kui-chip">🏆 得分 <b id="score">0</b></span>
            </div>
        </div>
    </div>

    <script src="/js/kids-ui.js"></script>
    <script src="/pwa.js" defer></script>
    <script>
        /**
         * 找不同小侦探：右图有 N 处改动，全部找出过关。
         * 主题池每关 16 个元素、5 组差异，关卡按需截取，保证差异数真实可达。
         */
        class FindDifferencesGame {
            constructor() {
                this.currentLevel = 1;
                this.maxLevels = 5;
                this.score = 0;
                this.foundCount = 0;
                this.mistakes = 0;
                this.totalDifferences = 3;
                this.hintsRemaining = 3;
                this.hintsUsed = 0;
                this.foundPositions = [];
                this.differences = [];
                this.canClick = true;
                this.gameId = 'find-differences';

                this.sceneThemes = {
                    farm: {
                        name: '🐄 农场',
                        baseElements: ['🐶', '🐱', '🐰', '🐔', '🌸', '🌻', '🏠', '🚜', '🍎', '🥕', '🐄', '🌾', '🐷', '🪣', '🐑', '🧺'],
                        differences: [
                            { from: '🐶', to: '🐺', hint: '小动物不一样' },
                            { from: '🌸', to: '🌼', hint: '花朵不一样' },
                            { from: '🐔', to: '🦆', hint: '家禽不一样' },
                            { from: '🍎', to: '🍅', hint: '果实不一样' },
                            { from: '🐑', to: '🐐', hint: '动物不一样' }
                        ]
                    },
                    ocean: {
                        name: '🌊 海洋',
                        baseElements: ['🐟', '🐠', '🐡', '🌊', '🏝️', '🦀', '⭐', '🌙', '🐙', '🐚', '🧜', '🪸', '⚓', '🦐', '🐢', '🫧'],
                        differences: [
                            { from: '🐟', to: '🐬', hint: '大鱼不一样' },
                            { from: '⭐', to: '💫', hint: '星星不一样' },
                            { from: '🐡', to: '🦈', hint: '鱼不一样' },
                            { from: '🐙', to: '🦑', hint: '触手动物不一样' },
                            { from: '🌙', to: '☀️', hint: '天上不一样' }
                        ]
                    },
                    park: {
                        name: '🌳 公园',
                        baseElements: ['🌳', '🌻', '⚽', '🏀', '🎨', '🧒', '🏸', '🎠', '⛲', '🦜', '🌷', '🛝', '🍦', '🚲', '🪁', '🌈'],
                        differences: [
                            { from: '⚽', to: '🏈', hint: '球不一样' },
                            { from: '🌳', to: '🌴', hint: '树不一样' },
                            { from: '🏀', to: '⚾', hint: '球不一样' },
                            { from: '🦜', to: '🦆', hint: '动物不一样' },
                            { from: '🍦', to: '🍭', hint: '甜品不一样' }
                        ]
                    },
                    space: {
                        name: '🚀 太空',
                        baseElements: ['🚀', '🛸', '🌍', '🌙', '⭐', '💫', '☄️', '👨‍🚀', '🪐', '🛰️', '🌌', '🔭', '🧑‍🚀', '🌠', '👽', '🛡️'],
                        differences: [
                            { from: '🚀', to: '🛩️', hint: '飞船不一样' },
                            { from: '⭐', to: '✨', hint: '星星不一样' },
                            { from: '🌙', to: '🌞', hint: '天上不一样' },
                            { from: '🛸', to: '🚁', hint: '飞行器不一样' },
                            { from: '👽', to: '👾', hint: '外星人不一样' }
                        ]
                    },
                    garden: {
                        name: '🌷 花园',
                        baseElements: ['🌸', '🌻', '🌷', '🌺', '🦋', '🐝', '🌿', '🍀', '🍄', '🌼', '🍓', '🐌', '🌱', '🐞', '🎋', '🕸️'],
                        differences: [
                            { from: '🌸', to: '🏵️', hint: '花不一样' },
                            { from: '🐝', to: '🐛', hint: '小虫子不一样' },
                            { from: '🍓', to: '🍎', hint: '果实不一样' },
                            { from: '🐌', to: '🪲', hint: '虫子不一样' },
                            { from: '🌻', to: '🎃', hint: '植物不一样' }
                        ]
                    }
                };

                this.levelConfig = [
                    { level: 1, theme: 'farm', elementCount: 8, differenceCount: 3 },
                    { level: 2, theme: 'ocean', elementCount: 10, differenceCount: 3 },
                    { level: 3, theme: 'park', elementCount: 12, differenceCount: 4 },
                    { level: 4, theme: 'space', elementCount: 14, differenceCount: 4 },
                    { level: 5, theme: 'garden', elementCount: 16, differenceCount: 5 }
                ];

                this.init();
            }

            init() {
                KidsUI.Touch.guard();
                KidsUI.Header.render({
                    title: '找不同小侦探',
                    accent: '#4f8ff7',
                    onReplay: () => this.startLevel(this.currentLevel)
                });
                this.bindEvents();
                this.startLevel(1);
            }

            bindEvents() {
                document.getElementById('skip-btn').addEventListener('click', () => {
                    KidsUI.SFX.tap();
                    this.nextLevel();
                });
                document.getElementById('hint-btn').addEventListener('click', () => {
                    this.useHint();
                });
                document.getElementById('right-scene').addEventListener('click', (e) => {
                    this.handleClick(e);
                });
            }

            startLevel(level) {
                this.currentLevel = level;
                this.foundCount = 0;
                this.mistakes = 0;
                this.hintsRemaining = 3;
                this.hintsUsed = 0;
                this.foundPositions = [];
                this.canClick = true;

                const config = this.levelConfig[level - 1];
                document.getElementById('level-badge').textContent = `第 ${level}/${this.maxLevels} 关`;
                document.getElementById('theme-name').textContent = this.sceneThemes[config.theme].name;
                document.getElementById('hint-count').textContent = this.hintsRemaining;
                document.getElementById('hint-btn').disabled = false;
                document.getElementById('right-scene').querySelectorAll('.difference-marker, .hint-highlight').forEach((el) => el.remove());

                this.generateLevel(level);
                this.renderScenes();
                this.updateStats();
                KidsUI.Progress.record(this.gameId, { best: level - 1 });
            }

            generateLevel(level) {
                const config = this.levelConfig[level - 1];
                const theme = this.sceneThemes[config.theme];
                this.totalDifferences = config.differenceCount;

                const baseElements = [...theme.baseElements]
                    .sort(() => Math.random() - 0.5)
                    .slice(0, config.elementCount);

                const picked = [...theme.differences]
                    .sort(() => Math.random() - 0.5)
                    .slice(0, config.differenceCount);

                const available = Array.from({ length: config.elementCount }, (_, i) => i);
                this.differences = picked.map((diff) => {
                    const randomIndex = Math.floor(Math.random() * available.length);
                    const position = available.splice(randomIndex, 1)[0];
                    return { ...diff, position };
                });

                this.leftScene = [...baseElements];
                this.rightScene = baseElements.map((el, idx) => {
                    const diff = this.differences.find((d) => d.position === idx);
                    return diff ? diff.to : el;
                });
            }

            renderScenes() {
                document.getElementById('left-scene').innerHTML = this.leftScene
                    .map((emoji, index) => `<span class="scene-emoji" data-index="${index}">${emoji}</span>`)
                    .join('');
                document.getElementById('right-scene').innerHTML = this.rightScene
                    .map((emoji, index) => `<span class="scene-emoji" data-index="${index}">${emoji}</span>`)
                    .join('');
                document.getElementById('diff-total').textContent = this.totalDifferences;
            }

            handleClick(e) {
                if (!this.canClick) return;

                const target = e.target;
                if (!target.classList.contains('scene-emoji')) return;

                const index = parseInt(target.dataset.index);
                // 已找出的差异位再次点击不记失误（幼儿常连点同一处）
                if (this.foundPositions.includes(index)) return;
                const difference = this.differences.find((diff) => diff.position === index);

                if (difference) {
                    this.foundPositions.push(index);
                    this.foundCount++;
                    this.markDifference(target);
                    KidsUI.SFX.correct();
                    KidsUI.haptic('good');

                    this.score += 10;
                    this.updateStats();

                    if (this.foundCount >= this.totalDifferences) {
                        this.canClick = false;
                        this.completeLevel();
                    }
                } else {
                    this.mistakes++;
                    KidsUI.SFX.wrong();
                    KidsUI.haptic('bad');
                    this.shakeElement(target);
                }
            }

            markDifference(element) {
                const marker = document.createElement('div');
                marker.className = 'difference-marker';
                const rect = element.getBoundingClientRect();
                const containerRect = document.getElementById('right-scene').getBoundingClientRect();
                marker.style.left = rect.left - containerRect.left + 'px';
                marker.style.top = rect.top - containerRect.top + 'px';
                document.getElementById('right-scene').appendChild(marker);
            }

            useHint() {
                if (this.hintsRemaining <= 0 || !this.canClick) return;

                const unfound = this.differences.filter((diff) => !this.foundPositions.includes(diff.position));
                if (unfound.length === 0) return;

                const hint = unfound[0];
                const targetElement = document.querySelector(`#right-scene .scene-emoji[data-index="${hint.position}"]`);
                if (!targetElement) return;

                const highlight = document.createElement('div');
                highlight.className = 'hint-highlight';
                const rect = targetElement.getBoundingClientRect();
                const containerRect = document.getElementById('right-scene').getBoundingClientRect();
                highlight.style.left = rect.left - containerRect.left - 5 + 'px';
                highlight.style.top = rect.top - containerRect.top - 5 + 'px';
                document.getElementById('right-scene').appendChild(highlight);
                setTimeout(() => highlight.remove(), 3000);

                this.hintsRemaining--;
                this.hintsUsed++;
                document.getElementById('hint-count').textContent = this.hintsRemaining;
                if (this.hintsRemaining <= 0) document.getElementById('hint-btn').disabled = true;
                KidsUI.SFX.tap();
            }

            shakeElement(element) {
                element.classList.remove('shake');
                void element.offsetWidth;
                element.classList.add('shake');
            }

            updateStats() {
                document.getElementById('found-count').textContent = `${this.foundCount}/${this.totalDifferences}`;
                document.getElementById('score').textContent = this.score;
            }

            completeLevel() {
                const accuracy = this.foundCount / (this.foundCount + this.mistakes);
                let stars = KidsUI.Progress.starsFor(accuracy);
                if (this.hintsUsed >= 2) stars = Math.min(stars, 2);
                if (this.hintsUsed >= 3) stars = Math.min(stars, 1);

                KidsUI.Progress.record(this.gameId, { stars, best: this.currentLevel });
                const isLast = this.currentLevel >= this.maxLevels;
                KidsUI.Celebrate.show({
                    title: isLast ? '全部过关！🏆' : '找到啦！',
                    sub: `第 ${this.currentLevel} 关 · 得分 ${this.score}`,
                    stars,
                    primaryLabel: isLast ? '再玩一轮' : '下一关 →',
                    onPrimary: () => this.nextLevel(),
                    announce: isLast ? '太厉害了，全部关都过啦！' : '太棒了！'
                });
            }

            nextLevel() {
                this.score = 0;
                this.startLevel(this.currentLevel < this.maxLevels ? this.currentLevel + 1 : 1);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new FindDifferencesGame();
        });
    </script>
</body>
</html>
