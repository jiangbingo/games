<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#3fa574">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="数字认知">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title>数字认知 - 儿童逻辑思维游戏</title>
    <link rel="stylesheet" href="/css/kids.css">
    <style>
        :root {
            --game-accent: #3fa574;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--kui-paper);
            background-image: radial-gradient(rgba(47, 42, 37, 0.03) 1px, transparent 1.4px);
            background-size: 26px 26px;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--kui-ink);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        #app {
            max-width: 560px;
            margin: 0 auto;
            padding: 14px 14px 30px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .game-container {
            background: var(--kui-card);
            border: 2px solid var(--kui-line);
            border-radius: var(--kui-radius-lg);
            box-shadow: var(--kui-shadow);
            padding: 22px 18px;
        }

        .instruction {
            text-align: center;
            font-size: clamp(18px, 4.5vw, 22px);
            font-weight: 800;
            margin-bottom: 18px;
        }

        .items-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            min-height: 120px;
            align-content: center;
            background: var(--kui-paper);
            border: 3px solid var(--kui-line);
            border-radius: var(--kui-radius-md);
            padding: 16px;
            margin-bottom: 22px;
        }

        .item {
            font-size: clamp(36px, 10vw, 54px);
            animation: itemBounce 0.5s var(--kui-bounce) backwards;
        }

        @keyframes itemBounce {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .options-area {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .option-btn {
            width: clamp(84px, 24vw, 110px);
            height: clamp(84px, 24vw, 110px);
            background: var(--kui-card);
            border: 3px solid var(--kui-line);
            border-radius: var(--kui-radius-md);
            box-shadow: var(--kui-shadow);
            font-size: clamp(38px, 11vw, 52px);
            font-weight: 900;
            color: var(--game-accent);
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.12s var(--kui-bounce), box-shadow 0.12s, border-color 0.12s;
        }

        .option-btn:hover {
            transform: translateY(-4px);
            border-color: var(--game-accent);
        }

        .option-btn:active {
            transform: scale(0.92);
            box-shadow: none;
        }

        .option-btn.correct {
            background: var(--kui-good);
            border-color: var(--kui-good);
            color: #fff;
            animation: correctPop 0.5s ease;
        }

        @keyframes correctPop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.14); }
        }

        .option-btn.wrong {
            animation: shake 0.4s ease;
            border-color: var(--kui-bad);
            background: #fdeae7;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .stats-area {
            display: flex;
            justify-content: center;
        }

        .settings-fab {
            position: fixed;
            bottom: 16px;
            right: 16px;
            width: 48px;
            height: 48px;
            border: 2px solid var(--kui-line);
            border-radius: 50%;
            background: var(--kui-card);
            box-shadow: var(--kui-shadow);
            font-size: 22px;
            cursor: pointer;
            z-index: 20;
        }

        .settings-panel {
            position: fixed;
            inset: 0;
            background: rgba(47, 42, 37, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 20px;
        }

        .settings-panel.show {
            display: flex;
        }

        .settings-card {
            background: var(--kui-card);
            border: 2px solid var(--kui-line);
            border-radius: var(--kui-radius-lg);
            box-shadow: 0 8px 0 rgba(47, 42, 37, 0.18);
            padding: 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .settings-title {
            font-size: 1.3rem;
            font-weight: 900;
            margin-bottom: 4px;
        }

        .settings-sub {
            color: var(--kui-ink-soft);
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        .range-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 18px;
        }

        .range-btn {
            padding: 13px 20px;
            font-size: 1rem;
            font-weight: 800;
            color: var(--kui-ink);
            background: var(--kui-paper);
            border: 3px solid var(--kui-line);
            border-radius: var(--kui-radius-md);
            cursor: pointer;
            touch-action: manipulation;
        }

        .range-btn.selected {
            border-color: var(--game-accent);
            background: #e8f5ee;
            box-shadow: 0 3px 0 rgba(47, 42, 37, 0.12);
        }

        @media (prefers-reduced-motion: reduce) {
            .item, .option-btn { animation: none; transition: none; }
            .option-btn.correct, .option-btn.wrong { animation-duration: 0.01s; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="game-container">
            <p class="instruction">🔢 数一数，有几个？</p>

            <div class="items-area" id="itemsArea" aria-label="要数的物品"></div>

            <div class="options-area" id="optionsArea" aria-label="数字选项"></div>

            <div class="stats-area">
                <span class="kui-chip">⭐ 答对 <b id="score">0</b> 次</span>
            </div>
        </div>
    </div>

    <button class="settings-fab" id="settingsBtn" type="button" aria-label="家长设置">⚙️</button>

    <div class="settings-panel" id="settingsPanel">
        <div class="settings-card">
            <div class="settings-title">家长设置</div>
            <p class="settings-sub">数字范围</p>
            <div class="range-options">
                <button type="button" class="range-btn" data-range="easy">1-3 · 简单</button>
                <button type="button" class="range-btn" data-range="medium">1-5 · 中等</button>
                <button type="button" class="range-btn" data-range="hard">1-10 · 困难</button>
            </div>
            <button type="button" class="kui-btn kui-big kui-primary" id="settingsClose">确定</button>
        </div>
    </div>

    <script src="/js/kids-ui.js"></script>
    <script src="/pwa.js" defer></script>
    <script>
        /**
         * 数字认知：数物品选数字。难度档位写入进度存档，答对会朗读数字。
         */
        const MAX_NUMBERS = { easy: 3, medium: 5, hard: 10 };
        const CELEBRATE_EVERY = 5;

        class NumberCountingGame {
            constructor() {
                this.gameId = 'number-counting';
                this.score = 0;
                this.misses = 0;
                this.isBusy = false;
                this.targetNumber = 0;
                this.range = this.loadRange();

                this.ITEMS = ['🍎', '🍊', '🍋', '🍇', '🍓', '🐶', '🐱', '🐻', '🐰', '🦋', '⭐', '🌈', '🎈', '🧸', '🚗'];

                this.init();
            }

            loadRange() {
                const saved = (KidsUI.Progress.get(this.gameId) || {}).settings;
                return saved && MAX_NUMBERS[saved.range] ? saved.range : 'easy';
            }

            init() {
                KidsUI.Touch.guard();
                KidsUI.Header.render({
                    title: '数字认知',
                    accent: '#3fa574',
                    onReplay: () => this.reset()
                });
                this.bindSettings();
                this.markSelected();
                this.newRound();
            }

            bindSettings() {
                document.getElementById('settingsBtn').addEventListener('click', () => {
                    KidsUI.SFX.tap();
                    document.getElementById('settingsPanel').classList.add('show');
                });
                document.getElementById('settingsClose').addEventListener('click', () => {
                    KidsUI.SFX.tap();
                    this.hideSettings();
                });
                document.querySelectorAll('.range-btn').forEach((btn) => {
                    btn.addEventListener('click', () => {
                        KidsUI.SFX.tap();
                        this.range = btn.dataset.range;
                        KidsUI.Progress.record(this.gameId, { settings: { range: this.range } });
                        this.markSelected();
                        this.hideSettings();
                        this.reset();
                    });
                });
            }

            hideSettings() {
                document.getElementById('settingsPanel').classList.remove('show');
            }

            markSelected() {
                document.querySelectorAll('.range-btn').forEach((btn) => {
                    btn.classList.toggle('selected', btn.dataset.range === this.range);
                });
            }

            reset() {
                this.score = 0;
                this.misses = 0;
                this.updateScore();
                this.newRound();
            }

            newRound() {
                this.isBusy = false;
                const maxNum = MAX_NUMBERS[this.range];
                this.targetNumber = Math.floor(Math.random() * maxNum) + 1;
                const itemType = this.ITEMS[Math.floor(Math.random() * this.ITEMS.length)];

                const itemsArea = document.getElementById('itemsArea');
                itemsArea.innerHTML = '';
                for (let i = 0; i < this.targetNumber; i++) {
                    const item = document.createElement('span');
                    item.className = 'item';
                    item.textContent = itemType;
                    item.style.animationDelay = i * 0.08 + 's';
                    itemsArea.appendChild(item);
                }

                const optionsArea = document.getElementById('optionsArea');
                optionsArea.innerHTML = '';
                this.generateOptions(this.targetNumber, maxNum).forEach((num) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'option-btn';
                    btn.textContent = num;
                    btn.addEventListener('click', () => this.pick(num, btn));
                    optionsArea.appendChild(btn);
                });
            }

            generateOptions(correct, maxNum) {
                const options = [correct];
                while (options.length < 3) {
                    const wrong = Math.floor(Math.random() * maxNum) + 1;
                    if (!options.includes(wrong)) options.push(wrong);
                }
                return options.sort(() => Math.random() - 0.5);
            }

            pick(num, btn) {
                if (this.isBusy) return;

                if (num === this.targetNumber) {
                    this.isBusy = true;
                    this.score += 1;
                    this.updateScore();
                    KidsUI.SFX.correct();
                    KidsUI.haptic('good');
                    KidsUI.TTS.speak(this.targetNumber + ' 个');
                    btn.classList.add('correct');

                    if (this.score % CELEBRATE_EVERY === 0) {
                        const stars = KidsUI.Progress.starsFor(this.score / (this.score + this.misses));
                        KidsUI.Progress.record(this.gameId, { best: this.score, stars });
                        setTimeout(() => {
                            KidsUI.Celebrate.show({
                                title: '数得真准！',
                                sub: `已经答对 ${this.score} 次`,
                                stars,
                                primaryLabel: '继续数',
                                onPrimary: () => this.newRound(),
                                announce: '太厉害了！'
                            });
                        }, 800);
                    } else {
                        setTimeout(() => this.newRound(), 1300);
                    }
                } else {
                    this.misses += 1;
                    KidsUI.SFX.wrong();
                    KidsUI.haptic('bad');
                    btn.classList.add('wrong');
                    setTimeout(() => btn.classList.remove('wrong'), 500);
                }
            }

            updateScore() {
                document.getElementById('score').textContent = this.score;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new NumberCountingGame();
        });
    </script>
</body>
</html>
