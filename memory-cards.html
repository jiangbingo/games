<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#9b5de5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="记忆翻牌">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>记忆翻牌 🎴 - 儿童逻辑思维游戏</title>
  <link rel="stylesheet" href="/css/kids.css">
  <style>
    :root {
      --game-accent: #9b5de5;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--kui-paper);
      background-image: radial-gradient(rgba(47, 42, 37, 0.03) 1px, transparent 1.4px);
      background-size: 26px 26px;
      min-height: 100vh;
      color: var(--kui-ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .page {
      width: 100%;
      max-width: 520px;
    }

    .level-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 8px 0 10px;
    }

    .theme-name {
      font-size: 1rem;
      font-weight: 800;
      color: var(--kui-ink-soft);
    }

    .level-badge {
      background: var(--game-accent);
      color: #fff;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 800;
      box-shadow: var(--kui-shadow);
    }

    .theme-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .theme-btn {
      padding: 6px 12px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      border: 2px solid var(--kui-line);
      border-radius: 999px;
      background: var(--kui-paper);
      color: var(--kui-ink-soft);
      cursor: pointer;
      touch-action: manipulation;
    }
    .theme-btn:active { transform: translateY(2px); }
    .theme-btn.active {
      background: var(--game-accent);
      color: #fff;
      border-color: rgba(47, 42, 37, 0.2);
    }

    .stats-row {
      display: flex;
      gap: 10px;
      margin: 0 0 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .game-container {
      background: var(--kui-card);
      border: 2px solid var(--kui-line);
      border-radius: var(--kui-radius-lg);
      box-shadow: var(--kui-shadow);
      padding: 16px;
      width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .card {
      aspect-ratio: 1;
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.5s var(--kui-bounce);
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card.matched .card-inner {
      animation: matchPop 0.5s var(--kui-bounce);
    }

    @keyframes matchPop {
      0% { transform: rotateY(180deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.12); }
      100% { transform: rotateY(180deg) scale(1); }
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--kui-radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2rem, 10vw, 3.2rem);
    }

    .card-back {
      background: var(--game-accent);
      border: 2px solid rgba(255, 255, 255, 0.5);
      box-shadow: var(--kui-shadow);
    }
    .card-back::after {
      content: '❓';
      font-size: clamp(1.4rem, 7vw, 2.2rem);
      color: #fff;
    }

    .card-front {
      background: var(--kui-paper);
      border: 2.5px solid var(--game-accent);
      transform: rotateY(180deg);
    }

    .card.matched .card-front {
      background: #eaf7f0;
      border-color: var(--kui-good);
    }

    .card.matched { pointer-events: none; }

    @media (min-width: 768px) {
      .grid { gap: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card-inner { transition: transform 0.15s; }
      .card.matched .card-inner { animation: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="level-row">
      <span class="theme-name" id="theme-name">🥕 蔬菜</span>
      <span class="level-badge" id="level-badge">第 1/7 关</span>
    </div>

    <div class="theme-bar" id="theme-bar"></div>

    <div class="stats-row">
      <span class="kui-chip">👣 步数 <b id="moves">0</b></span>
      <span class="kui-chip">🎴 配对 <b id="pairs">0/4</b></span>
    </div>

    <div class="game-container">
      <div class="grid" id="game-grid"></div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="/js/kids-ui.js"></script>
  <script src="/pwa.js" defer></script>
  <script>
    // 每个主题 12 个物品，够最高关卡取材
    const THEMES = {
      vegetables: { name: '🥕 蔬菜', emojis: ['🥕', '🥦', '🍅', '🌽', '🥒', '🍆', '🥔', '🧅', '🥬', '🍄', '🌶️', '🍠'] },
      animals: { name: '🐶 动物', emojis: ['🐶', '🐱', '🐰', '🦊', '🐻', '🐼', '🐷', '🐸', '🐵', '🦁', '🐮', '🐔'] },
      kitchen: { name: '🍳 厨房', emojis: ['🍳', '🍲', '🥄', '🍴', '☕', '🍽️', '🧂', '🥛', '🍯', '🥣', '🥤', '🧊'] },
      plants: { name: '🌸 花草', emojis: ['🌸', '🌻', '🌷', '🌹', '🌼', '🌵', '🌿', '🍀', '🌺', '🌱', '🌳', '🍁'] },
      fruits: { name: '🍎 水果', emojis: ['🍎', '🍊', '🍋', '🍇', '🍓', '🍌', '🍉', '🍑', '🍒', '🥝', '🥭', '🍍'] }
    };

    const RANDOM_THEME = 'random';
    // 难度递增：每关的对数（到顶后维持 10 对）
    const LEVEL_PAIRS = [4, 5, 6, 7, 8, 9, 10];
    const MATCH_FLIP_MS = 300;
    const FLIP_BACK_MS = 1000;
    const MIN_AI_PAIRS = 4;
    const gameId = 'memory-cards';

    // 兼容旧版：AI 缓存的题目有则追加为一个可选主题（素材不够对数时自动用其他主题补足）
    try {
      const cached = new AIGameCache().getLatestGame('memory');
      const aiEmojis = Array.isArray(cached && cached.emojis)
        ? [...new Set(cached.emojis)].filter((e) => typeof e === 'string' && e.length > 0 && e.length <= 8)
        : [];
      if (aiEmojis.length >= MIN_AI_PAIRS) THEMES.ai = { name: '🤖 AI 题目', emojis: aiEmojis };
    } catch (error) {
      /* 无 AI 题目：仅用内置主题 */
    }

    const ALL_EMOJIS = Object.keys(THEMES).reduce((all, key) => all.concat(THEMES[key].emojis), []);

    let themeKey = RANDOM_THEME;
    let level = 1;
    let activeTheme = THEMES.vegetables;
    let levelEmojis = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let isLocked = false;
    let headerBound = false;

    function shuffle(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function pairsForLevel(target) {
      return LEVEL_PAIRS[Math.min(target, LEVEL_PAIRS.length) - 1];
    }

    function pickTheme() {
      if (themeKey !== RANDOM_THEME) return THEMES[themeKey];
      const keys = Object.keys(THEMES);
      return THEMES[keys[Math.floor(Math.random() * keys.length)]];
    }

    function pickEmojis(theme, count) {
      const own = shuffle(theme.emojis);
      const extra = shuffle(ALL_EMOJIS.filter((e) => !theme.emojis.includes(e)));
      return own.concat(extra).slice(0, count);
    }

    function renderThemeBar() {
      const bar = document.getElementById('theme-bar');
      bar.innerHTML = '';
      [RANDOM_THEME].concat(Object.keys(THEMES)).forEach((key) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'theme-btn' + (key === themeKey ? ' active' : '');
        btn.textContent = key === RANDOM_THEME ? '🎲 随机' : THEMES[key].name;
        btn.addEventListener('click', () => selectTheme(key));
        bar.appendChild(btn);
      });
    }

    // 换主题只换物品、不重开：牌面按旧→新一一映射，已配对/已翻开与步数都保留
    function selectTheme(key) {
      if (key === themeKey) return;
      themeKey = key;
      KidsUI.SFX.tap();
      renderThemeBar();

      const theme = pickTheme();
      const next = pickEmojis(theme, levelEmojis.length);
      const remap = {};
      levelEmojis.forEach((old, i) => { remap[old] = next[i]; });
      document.querySelectorAll('.card').forEach((card) => {
        const emoji = remap[card.dataset.emoji];
        card.dataset.emoji = emoji;
        card.querySelector('.card-front').textContent = emoji;
      });

      levelEmojis = next;
      activeTheme = theme;
      updateStats();
    }

    function createCard(emoji) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.emoji = emoji;

      const cardInner = document.createElement('div');
      cardInner.className = 'card-inner';

      const cardBack = document.createElement('div');
      cardBack.className = 'card-face card-back';

      const cardFront = document.createElement('div');
      cardFront.className = 'card-face card-front';
      cardFront.textContent = emoji;

      cardInner.appendChild(cardBack);
      cardInner.appendChild(cardFront);
      card.appendChild(cardInner);

      card.addEventListener('click', () => flipCard(card));
      return card;
    }

    function initGame() {
      const grid = document.getElementById('game-grid');
      grid.innerHTML = '';

      activeTheme = pickTheme();
      levelEmojis = pickEmojis(activeTheme, pairsForLevel(level));
      flippedCards = [];
      matchedPairs = 0;
      moves = 0;
      isLocked = false;
      updateStats();

      shuffle(levelEmojis.concat(levelEmojis)).forEach((emoji) => grid.appendChild(createCard(emoji)));
    }

    function flipCard(card) {
      if (isLocked || card.classList.contains('flipped') || card.classList.contains('matched')) return;

      card.classList.add('flipped');
      flippedCards.push(card);
      KidsUI.SFX.tap();

      if (flippedCards.length === 2) {
        moves++;
        updateStats();
        checkMatch();
      }
    }

    function checkMatch() {
      isLocked = true;
      const [card1, card2] = flippedCards;
      const isMatch = card1.dataset.emoji === card2.dataset.emoji;

      if (isMatch) {
        setTimeout(() => {
          // 300ms 内点 ↻ 重开会重建棋盘，旧定时器不能污染新局状态
          if (!card1.isConnected) return;
          card1.classList.add('matched');
          card2.classList.add('matched');
          matchedPairs++;
          updateStats();
          KidsUI.SFX.correct();
          KidsUI.haptic('good');

          flippedCards = [];
          isLocked = false;

          if (matchedPairs === levelEmojis.length) {
            // 先落盘再等结算动画：这 450ms 里点 ↻ 会重建棋盘，奖励不能被吞掉
            const stars = KidsUI.Progress.starsFor(levelEmojis.length / moves);
            KidsUI.Progress.record(gameId, { stars });
            setTimeout(() => {
              if (card1.isConnected) showWin(stars);
            }, 450);
          }
        }, MATCH_FLIP_MS);
      } else {
        KidsUI.SFX.wrong();
        setTimeout(() => {
          // 面板重建后旧定时器若照常解锁，会放行第三张牌卡死配对计数
          if (!card1.isConnected) return;
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          flippedCards = [];
          isLocked = false;
        }, FLIP_BACK_MS);
      }
    }

    function updateStats() {
      document.getElementById('moves').textContent = moves;
      document.getElementById('pairs').textContent = `${matchedPairs}/${levelEmojis.length}`;
      document.getElementById('theme-name').textContent = activeTheme.name;
      document.getElementById('level-badge').textContent = `第 ${level}/${LEVEL_PAIRS.length} 关`;
    }

    // 步数越少星越多：完美 = 每步一对（记分已在最后一对配对成功时落盘）
    function showWin(stars) {
      const isLast = level >= LEVEL_PAIRS.length;
      KidsUI.Celebrate.show({
        title: isLast ? '全部通关！🏆' : '配对完成！',
        sub: `第 ${level}/${LEVEL_PAIRS.length} 关 · ${activeTheme.name} · 用了 ${moves} 步`,
        stars,
        primaryLabel: isLast ? '再玩一轮' : '下一关 →',
        onPrimary: () => {
          level = isLast ? 1 : level + 1;
          initGame();
        },
        announce: isLast ? '太厉害了，全部关卡都完成啦！' : '太棒了，全部配对成功！'
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      KidsUI.Touch.guard();
      if (!headerBound) {
        headerBound = true;
        KidsUI.Header.render({
          title: '记忆翻牌',
          accent: '#9b5de5',
          onReplay: initGame
        });
      }
      renderThemeBar();
      initGame();
    });
  </script>
</body>
</html>
