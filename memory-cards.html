<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#9b5de5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="记忆翻牌">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>记忆翻牌 🎴 - 儿童逻辑思维游戏</title>
  <link rel="stylesheet" href="/css/kids.css">
  <style>
    :root {
      --game-accent: #9b5de5;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--kui-paper);
      background-image: radial-gradient(rgba(47, 42, 37, 0.03) 1px, transparent 1.4px);
      background-size: 26px 26px;
      min-height: 100vh;
      color: var(--kui-ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .stats-row {
      display: flex;
      gap: 10px;
      margin: 8px 0 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .game-container {
      background: var(--kui-card);
      border: 2px solid var(--kui-line);
      border-radius: var(--kui-radius-lg);
      box-shadow: var(--kui-shadow);
      padding: 16px;
      width: 100%;
      max-width: 520px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .card {
      aspect-ratio: 1;
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.5s var(--kui-bounce);
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card.matched .card-inner {
      animation: matchPop 0.5s var(--kui-bounce);
    }

    @keyframes matchPop {
      0% { transform: rotateY(180deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.12); }
      100% { transform: rotateY(180deg) scale(1); }
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--kui-radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2rem, 10vw, 3.2rem);
    }

    .card-back {
      background: var(--game-accent);
      border: 2px solid rgba(255, 255, 255, 0.5);
      box-shadow: var(--kui-shadow);
    }
    .card-back::after {
      content: '❓';
      font-size: clamp(1.4rem, 7vw, 2.2rem);
      color: #fff;
    }

    .card-front {
      background: var(--kui-paper);
      border: 2.5px solid var(--game-accent);
      transform: rotateY(180deg);
    }

    .card.matched .card-front {
      background: #eaf7f0;
      border-color: var(--kui-good);
    }

    .card.matched { pointer-events: none; }

    @media (min-width: 768px) {
      .grid { gap: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card-inner { transition: transform 0.15s; }
      .card.matched .card-inner { animation: none; }
    }
  </style>
</head>
<body>
  <div class="stats-row">
    <span class="kui-chip">👣 步数 <b id="moves">0</b></span>
    <span class="kui-chip">🎴 配对 <b id="pairs">0/6</b></span>
  </div>

  <div class="game-container">
    <div class="grid" id="game-grid"></div>
  </div>

  <script src="js/storage.js"></script>
  <script src="/js/kids-ui.js"></script>
  <script src="/pwa.js" defer></script>
  <script>
    // Emoji 对（默认 6 对 = 12 张）
    const DEFAULT_EMOJIS = ['🐶', '🐱', '🐰', '🦊', '🐻', '🐼'];
    const MIN_PAIRS = 4;
    const MAX_PAIRS = 12;
    const gameId = 'memory-cards';

    let EMOJIS = DEFAULT_EMOJIS;
    let cards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let isLocked = false;
    let headerBound = false;

    // 兼容旧版：AI 缓存的自定义题目（长度截到 4-12 对）
    try {
      const aiCache = new AIGameCache();
      const aiGameData = aiCache.getLatestGame('memory');
      if (aiGameData && Array.isArray(aiGameData.emojis) && aiGameData.emojis.length >= MIN_PAIRS) {
        const validEmojis = [...new Set(aiGameData.emojis)]
          .filter(e => typeof e === 'string' && e.length > 0 && e.length <= 8)
          .slice(0, MAX_PAIRS);
        if (validEmojis.length >= MIN_PAIRS) {
          EMOJIS = validEmojis;
        }
      }
    } catch (error) {
      /* 使用默认题目 */
    }

    function shuffle(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function createCard(emoji) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.emoji = emoji;

      const cardInner = document.createElement('div');
      cardInner.className = 'card-inner';

      const cardBack = document.createElement('div');
      cardBack.className = 'card-face card-back';

      const cardFront = document.createElement('div');
      cardFront.className = 'card-face card-front';
      cardFront.textContent = emoji;

      cardInner.appendChild(cardBack);
      cardInner.appendChild(cardFront);
      card.appendChild(cardInner);

      card.addEventListener('click', () => flipCard(card));
      return card;
    }

    function initGame() {
      const grid = document.getElementById('game-grid');
      grid.innerHTML = '';

      flippedCards = [];
      matchedPairs = 0;
      moves = 0;
      isLocked = false;
      updateStats();

      cards = shuffle([...EMOJIS, ...EMOJIS]);
      cards.forEach((emoji) => grid.appendChild(createCard(emoji)));
    }

    function flipCard(card) {
      if (isLocked || card.classList.contains('flipped') || card.classList.contains('matched')) return;

      card.classList.add('flipped');
      flippedCards.push(card);
      KidsUI.SFX.tap();

      if (flippedCards.length === 2) {
        moves++;
        updateStats();
        checkMatch();
      }
    }

    function checkMatch() {
      isLocked = true;
      const [card1, card2] = flippedCards;
      const isMatch = card1.dataset.emoji === card2.dataset.emoji;

      if (isMatch) {
        setTimeout(() => {
          // 300ms 内点 ↻ 重开会重建棋盘，旧定时器不能污染新局状态
          if (!card1.isConnected) return;
          card1.classList.add('matched');
          card2.classList.add('matched');
          matchedPairs++;
          updateStats();
          KidsUI.SFX.correct();
          KidsUI.haptic('good');

          flippedCards = [];
          isLocked = false;

          if (matchedPairs === EMOJIS.length) {
            setTimeout(() => {
              if (card1.isConnected) showWin();
            }, 450);
          }
        }, 300);
      } else {
        KidsUI.SFX.wrong();
        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          flippedCards = [];
          isLocked = false;
        }, 1000);
      }
    }

    function updateStats() {
      document.getElementById('moves').textContent = moves;
      document.getElementById('pairs').textContent = `${matchedPairs}/${EMOJIS.length}`;
    }

    // 步数越少星越多：完美 = 每步一对
    function showWin() {
      const stars = KidsUI.Progress.starsFor(EMOJIS.length / moves);
      KidsUI.Progress.record(gameId, { stars, best: EMOJIS.length });
      KidsUI.Celebrate.show({
        title: '全部配好啦！',
        sub: `用了 ${moves} 步 · ${EMOJIS.length} 对`,
        stars,
        primaryLabel: '再来一局',
        onPrimary: () => initGame(),
        announce: '太棒了，全部配对成功！'
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      KidsUI.Touch.guard();
      if (!headerBound) {
        headerBound = true;
        KidsUI.Header.render({
          title: '记忆翻牌',
          accent: '#9b5de5',
          onReplay: initGame
        });
      }
      initGame();
    });
  </script>
</body>
</html>
