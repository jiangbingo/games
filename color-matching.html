<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#e5533d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="颜色配对">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title>颜色配对 - 儿童逻辑思维游戏</title>
    <link rel="stylesheet" href="/css/kids.css">
    <style>
        :root {
            --game-accent: #e5533d;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--kui-paper);
            background-image: radial-gradient(rgba(47, 42, 37, 0.03) 1px, transparent 1.4px);
            background-size: 26px 26px;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--kui-ink);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        #app {
            max-width: 560px;
            margin: 0 auto;
            padding: 14px 14px 30px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .game-container {
            background: var(--kui-card);
            border: 2px solid var(--kui-line);
            border-radius: var(--kui-radius-lg);
            box-shadow: var(--kui-shadow);
            padding: 22px 18px;
        }

        .target-area {
            text-align: center;
            margin-bottom: 24px;
        }

        .target-label {
            font-size: clamp(17px, 4.5vw, 21px);
            font-weight: 800;
            margin-bottom: 16px;
        }

        .target-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .target-swatch {
            width: clamp(72px, 20vw, 96px);
            height: clamp(72px, 20vw, 96px);
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 4px 0 rgba(47, 42, 37, 0.18), 0 0 0 3px var(--kui-line);
            animation: swatchPulse 1.6s ease-in-out infinite;
        }

        @keyframes swatchPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        .target-name {
            font-size: clamp(30px, 9vw, 44px);
            font-weight: 900;
            color: var(--game-accent);
        }

        .options-area {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            justify-items: center;
            margin-bottom: 20px;
        }

        .color-btn {
            width: clamp(110px, 30vw, 150px);
            height: clamp(110px, 30vw, 150px);
            border: 5px solid #fff;
            border-radius: 26px;
            box-shadow: 0 5px 0 rgba(47, 42, 37, 0.2);
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.12s var(--kui-bounce), box-shadow 0.12s;
        }

        .color-btn:hover {
            transform: translateY(-4px);
        }

        .color-btn:active {
            transform: scale(0.92);
            box-shadow: 0 2px 0 rgba(47, 42, 37, 0.2);
        }

        .color-btn.correct {
            animation: correctPop 0.5s ease;
            box-shadow: 0 0 0 5px var(--kui-good), 0 5px 0 rgba(47, 42, 37, 0.2);
        }

        @keyframes correctPop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.14); }
        }

        .color-btn.wrong {
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .stats-area {
            display: flex;
            justify-content: center;
        }

        @media (prefers-reduced-motion: reduce) {
            .target-swatch, .color-btn { animation: none; transition: none; }
            .color-btn.correct, .color-btn.wrong { animation-duration: 0.01s; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="game-container">
            <div class="target-area">
                <div class="target-label">🎨 找到这个颜色：</div>
                <div class="target-row">
                    <div class="target-swatch" id="targetSwatch"></div>
                    <div class="target-name" id="targetName">红色</div>
                </div>
            </div>

            <div class="options-area" id="optionsArea" aria-label="颜色选项"></div>

            <div class="stats-area">
                <span class="kui-chip">⭐ 找到 <b id="score">0</b> 次</span>
            </div>
        </div>
    </div>

    <script src="/js/kids-ui.js"></script>
    <script src="/pwa.js" defer></script>
    <script>
        /**
         * 颜色配对：目标同时给出「色块 + 名称」并朗读，不识字也能玩。
         */
        class ColorMatchingGame {
            constructor() {
                this.gameId = 'color-matching';
                this.CELEBRATE_EVERY = 5;
                this.score = 0;
                this.misses = 0;
                this.target = null;
                this.isBusy = false;

                this.COLORS = [
                    { name: '红色', hex: '#FF4757', light: '#FF6B7A' },
                    { name: '黄色', hex: '#FFA502', light: '#FFB732' },
                    { name: '蓝色', hex: '#3742FA', light: '#5352ED' },
                    { name: '绿色', hex: '#2ED573', light: '#7BED9F' },
                    { name: '橙色', hex: '#FF6B35', light: '#FF7F50' },
                    { name: '紫色', hex: '#A55EEA', light: '#BE7ADB' },
                    { name: '粉色', hex: '#FF69B4', light: '#FF85C1' },
                    { name: '黑色', hex: '#2C3E50', light: '#34495E' }
                ];

                this.init();
            }

            init() {
                KidsUI.Touch.guard();
                KidsUI.Header.render({
                    title: '颜色配对',
                    accent: '#e5533d',
                    onReplay: () => this.reset()
                });
                this.newRound();
            }

            reset() {
                this.score = 0;
                this.misses = 0;
                this.updateScore();
                this.newRound();
            }

            newRound() {
                this.isBusy = false;
                const selected = [...this.COLORS].sort(() => Math.random() - 0.5).slice(0, 4);
                this.target = selected[Math.floor(Math.random() * selected.length)];

                const swatch = document.getElementById('targetSwatch');
                swatch.style.background = `linear-gradient(135deg, ${this.target.hex} 0%, ${this.target.light} 100%)`;
                document.getElementById('targetName').textContent = this.target.name;
                KidsUI.TTS.speak(this.target.name);

                const area = document.getElementById('optionsArea');
                area.innerHTML = '';
                [...selected].sort(() => Math.random() - 0.5).forEach((color) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'color-btn';
                    btn.style.background = `linear-gradient(135deg, ${color.hex} 0%, ${color.light} 100%)`;
                    btn.addEventListener('click', () => this.pick(color, btn));
                    area.appendChild(btn);
                });
            }

            pick(color, btn) {
                if (this.isBusy) return;

                if (color.name === this.target.name) {
                    this.isBusy = true;
                    this.score += 1;
                    this.updateScore();
                    KidsUI.SFX.correct();
                    KidsUI.haptic('good');
                    btn.classList.add('correct');

                    if (this.score % this.CELEBRATE_EVERY === 0) {
                        const stars = KidsUI.Progress.starsFor(this.score / (this.score + this.misses));
                        KidsUI.Progress.record(this.gameId, { best: this.score, stars });
                        setTimeout(() => {
                            KidsUI.Celebrate.show({
                                title: '真棒！',
                                sub: `已经找到 ${this.score} 次`,
                                stars,
                                primaryLabel: '继续找',
                                onPrimary: () => this.newRound(),
                                announce: '太厉害了！'
                            });
                        }, 600);
                    } else {
                        setTimeout(() => this.newRound(), 900);
                    }
                } else {
                    this.misses += 1;
                    KidsUI.SFX.wrong();
                    KidsUI.haptic('bad');
                    btn.classList.add('wrong');
                    setTimeout(() => btn.classList.remove('wrong'), 500);
                }
            }

            updateScore() {
                document.getElementById('score').textContent = this.score;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new ColorMatchingGame();
        });
    </script>
</body>
</html>
